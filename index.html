<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Church App</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f5c400">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding-bottom: 90px;
    }

    .container {
      padding: 16px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    h2 {
      margin: 0 0 10px;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #222;
    }

    .task:last-child {
      border-bottom: none;
    }

    button {
      background: #f5c400;
      color: #000;
      border: none;
      border-radius: 20px;
      padding: 8px 18px;
      font-weight: bold;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 200px;
      border-radius: 12px;
      border: none;
    }

    /* Install Button */
    #installBtn {
      display: none;
      width: 100%;
      margin-top: 10px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000;
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      padding: 16px 0;
    }

    .bottom-nav div {
      color: #f5c400;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- DASHBOARD -->
  <div class="card">
    <h2>Dashboard</h2>
    <p>Email: joeledward949@gmail.com</p>
    <p>XP: <span id="xp">0</span></p>

    <!-- INSTALL BUTTON -->
    <button id="installBtn">Install App</button>
  </div>

  <!-- TASKS -->
  <div class="card">
    <h2>📝 Tasks</h2>

    <div class="task">
      <span>Watch Live Stream</span>
      <button onclick="completeTask(this)">Complete</button>
    </div>

    <div class="task">
      <span>Share App</span>
      <button onclick="completeTask(this)">Complete</button>
    </div>

    <div class="task">
      <span>Invite Friend</span>
      <button onclick="completeTask(this)">Complete</button>
    </div>
  </div>

  <!-- LIVE STREAM -->
  <div class="card">
    <h2>📺 Live Stream</h2>

    <iframe
      src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&mute=1"
      allow="autoplay; encrypted-media"
      allowfullscreen>
    </iframe>

    <p style="opacity:0.6;margin-top:8px;">
      Live placeholder – connects to social platforms later
    </p>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <div onclick="scrollToTop()">Home</div>
  <div onclick="scrollToLive()">Live</div>
  <div onclick="scrollToTasks()">Tasks</div>
  <div onclick="alert('Profile coming soon')">Profile</div>
</div>

<script>
  let xp = 0;
  let deferredPrompt;

  function completeTask(btn) {
    if (btn.innerText === "Completed") return;
    xp += 10;
    document.getElementById("xp").innerText = xp;
    btn.innerText = "Completed";
    btn.disabled = true;
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function scrollToTasks() {
    document.querySelectorAll('.card')[1].scrollIntoView({ behavior: 'smooth' });
  }

  function scrollToLive() {
    document.querySelectorAll('.card')[2].scrollIntoView({ behavior: 'smooth' });
  }

  /* INSTALL APP LOGIC */
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').style.display = 'block';
  });

  document.getElementById('installBtn').addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBtn').style.display = 'none';
  });

  /* SERVICE WORKER */
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('service-worker.js');
  }
</script>

</body>
    </html>
