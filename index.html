<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rewards Task App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 40px;
    }
    .box {
      max-width: 400px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    button {
      background: #2d89ff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background: #1b5fd9;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div id="loginBox" class="box">
  <h2>Demo Login</h2>
  <input id="email" type="email" placeholder="Email" value="demo@engagementapp.com" />
  <input id="password" type="password" placeholder="Password" />
  <button id="loginBtn">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="dashboard" class="box hidden">
  <h2>Welcome 🎉</h2>
  <p>You are logged in.</p>
  <button id="logoutBtn">Logout</button>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
// Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyAezeP-Hh60aStIXWxDMp82PVh973eMbb0",
  authDomain: "engagement-app-72208.firebaseapp.com",
  projectId: "engagement-app-72208",
  storageBucket: "engagement-app-72208.firebasestorage.app",
  messagingSenderId: "994138223274",
  appId: "1:994138223274:web:02b1d185fda4e3126f56d3"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const loginBox = document.getElementById("loginBox");
  const dashboard = document.getElementById("dashboard");
  const errorEl = document.getElementById("error");

  // KEEP USER LOGGED IN
  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginBox.classList.add("hidden");
      dashboard.classList.remove("hidden");
    } else {
      loginBox.classList.remove("hidden");
      dashboard.classList.add("hidden");
    }
  });

  // LOGIN
  document.getElementById("loginBtn").addEventListener("click", async () => {
    errorEl.textContent = "";
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      errorEl.textContent = err.message;
    }
  });

  // LOGOUT
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
  });
</script>

</body>
                                     </html>
