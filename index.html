<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church</title>
<style>
/* ---------- General Styles ---------- */
body { 
  font-family: Arial, sans-serif; 
  background: #1e1e2f; /* dark iPhone-like background */
  margin: 0; 
  padding: 0; 
  color: #fff;
}

.container { 
  max-width: 500px; 
  margin: 20px auto; 
  padding: 20px; 
}

/* ---------- Headings ---------- */
#headerTitle { 
  font-size: 36px; 
  text-align: center; 
  margin-bottom: 20px;
}

/* ---------- Sections ---------- */
.section { display: none; margin-bottom: 80px; }
.active-section { display: block; }

/* ---------- Boxes ---------- */
.box { 
  background: #2c2c44; 
  border-radius: 16px; 
  padding: 16px; 
  margin-bottom: 16px;
}

/* ---------- Buttons ---------- */
button.action { 
  width: 100%; 
  font-size: 20px; 
  padding: 14px; 
  border-radius: 14px; 
  border: none; 
  color: #fff; 
  background: #4a90e2; 
  font-weight: bold; 
  margin-top: 10px;
  cursor: pointer;
}
button.action:hover { background: #3572c0; }

/* ---------- Inputs ---------- */
input, textarea { 
  width: 100%; 
  padding: 12px; 
  border-radius: 12px; 
  border: none; 
  margin-top: 8px; 
  font-size: 18px;
}

/* ---------- Bottom Navigation ---------- */
#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  background: #2c2c44;
  justify-content: space-around;
  padding: 12px 0;
  box-shadow: 0 -3px 10px rgba(0,0,0,0.3);
  border-top-left-radius: 16px;
  border-top-right-radius: 16px;
}

#bottom-nav button {
  background: none;
  color: #fff;
  border: none;
  font-size: 18px;
  font-weight: bold;
  flex: 1;
}
#bottom-nav button.active { color: #4a90e2; }

</style>
</head>
<body>

<div class="container">
  <div id="headerTitle">Church</div>

  <!-- King James Bible (AI) -->
  <div id="bible" class="section active-section">
    <div class="box">
      <strong>📖 King James Bible (AI)</strong>
      <input type="text" id="bibleInput" placeholder="Search Chapter:Verse (e.g., John 3:16)">
      <button class="action" onclick="readVerse()">Read Verse</button>
      <div id="bibleOutput" class="box" style="margin-top:10px; color:#ffd700;"></div>
    </div>
  </div>

  <!-- Prayer Requests -->
  <div id="prayer" class="section">
    <div class="box">
      <strong>🙏 Prayer Requests</strong>
      <textarea id="prayerInput" placeholder="Type your prayer request..."></textarea>
      <button class="action" onclick="addPrayer()">Send Prayer</button>
      <ul id="prayerLog" class="box" style="margin-top:10px; color:#ffd700;"></ul>
    </div>
  </div>

  <!-- Marriage Counseling -->
  <div id="counseling" class="section">
    <div class="box">
      <strong>💍 Marriage Counseling</strong>
      <textarea id="counselingInput" placeholder="Describe your counseling need..."></textarea>
      <button class="action" onclick="addCounseling()">Request Counseling</button>
      <ul id="counselingLog" class="box" style="margin-top:10px; color:#ffd700;"></ul>
    </div>
  </div>

  <!-- Donation -->
  <div id="donation" class="section">
    <div class="box">
      <strong>💰 Donation</strong>
      <input type="text" id="donationInput" placeholder="Enter donation amount">
      <button class="action" onclick="addDonation()">Donate</button>
      <ul id="donationLog" class="box" style="margin-top:10px; color:#ffd700;"></ul>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<div id="bottom-nav">
  <button id="nav-bible" class="active" onclick="showSection('bible')">📖 Bible</button>
  <button id="nav-prayer" onclick="showSection('prayer')">🙏 Prayer</button>
  <button id="nav-counseling" onclick="showSection('counseling')">💍 Counseling</button>
  <button id="nav-donation" onclick="showSection('donation')">💰 Donation</button>
</div>

<script>
// ---------- Navigation ----------
function showSection(section){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-section'));
  document.getElementById(section).classList.add('active-section');

  document.querySelectorAll('#bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-' + section).classList.add('active');

  // Change header to current section
  let headerText = {
    'bible':'Church',
    'prayer':'Prayer Requests',
    'counseling':'Marriage Counseling',
    'donation':'Donation'
  };
  document.getElementById('headerTitle').textContent = headerText[section];
}

// ---------- King James Bible (AI) ----------
function readVerse(){
  const input = document.getElementById('bibleInput').value.trim();
  if(!input) return alert("Enter a chapter:verse");
  // Simulated AI response
  document.getElementById('bibleOutput').textContent = `📖 AI Reading of ${input}: "In the beginning God created the heaven and the earth..."`;
}

// ---------- Prayer ----------
let prayers = [];
function addPrayer(){
  const input = document.getElementById('prayerInput').value.trim();
  if(!input) return alert("Type your prayer request");
  prayers.push(input);
  const ul = document.getElementById('prayerLog');
  const li = document.createElement('li');
  li.textContent = input;
  ul.appendChild(li);
  document.getElementById('prayerInput').value = "";
}

// ---------- Counseling ----------
let counselings = [];
function addCounseling(){
  const input = document.getElementById('counselingInput').value.trim();
  if(!input) return alert("Describe your counseling need");
  counselings.push(input);
  const ul = document.getElementById('counselingLog');
  const li = document.createElement('li');
  li.textContent = input;
  ul.appendChild(li);
  document.getElementById('counselingInput').value = "";
}

// ---------- Donation ----------
let donations = [];
function addDonation(){
  const input = document.getElementById('donationInput').value.trim();
  if(!input) return alert("Enter donation amount");
  donations.push(input);
  const ul = document.getElementById('donationLog');
  const li = document.createElement('li');
  li.textContent = "$" + input;
  ul.appendChild(li);
  document.getElementById('donationInput').value = "";
}
</script>

</body>
  </html>
