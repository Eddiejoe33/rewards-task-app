<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🙏 Church App</title>
<style>
/* ---------- General Styles ---------- */
body { 
  font-family: Arial, sans-serif; 
  background: #f0f2f5; 
  margin: 0; 
  padding: 0; 
  font-size: 20px; /* big font */
}

.container { 
  max-width: 900px; 
  margin: 30px auto; 
  background: #fff; 
  padding: 30px; 
  border-radius: 12px; 
  box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
}

/* ---------- Headings ---------- */
h1 { color: #2c3e50; margin-bottom: 25px; font-size: 32px; }
h2 { font-size: 26px; margin-top: 25px; }

/* ---------- Boxes ---------- */
.box { 
  background: #f9f9f9; 
  border: 1px solid #ddd; 
  padding: 22px; 
  border-radius: 12px; 
  margin-top: 20px; 
  font-size: 20px; 
}

/* ---------- List ---------- */
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 22px; }
li:last-child { border-bottom: none; }

/* ---------- Buttons ---------- */
button.action { 
  background: #1abc9c; 
  margin-top: 20px; 
  width: 100%; 
  font-size: 24px; 
  padding: 18px; 
  border-radius: 12px; 
  color: #fff; 
  border: none; 
  cursor: pointer; 
  transition: 0.3s;
}
button.action:hover { background: #16a085; }

/* ---------- Inputs ---------- */
input, textarea { 
  width: 100%; 
  padding: 18px; 
  border-radius: 12px; 
  border: 1px solid #ccc; 
  margin-top: 14px; 
  font-size: 20px; 
}
textarea { resize: vertical; }

/* ---------- Sections ---------- */
.section { display: none; }
.active-section { display: block; }

/* ---------- Bottom Navigation ---------- */
#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  background: #2c3e50;
  justify-content: space-around;
  padding: 14px 0;
  box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
}
#bottom-nav button {
  background: none;
  color: #fff;
  border: none;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  flex: 1;
}
#bottom-nav button.active { color: #1abc9c; }
</style>
</head>
<body>

<div class="container">
  <h1>🙏 Church App</h1>

  <!-- Dashboard Section -->
  <div id="dashboard" class="section active-section">
    <h2>🗂 Tasks</h2>
    <div id="tasks" class="box">
      <ul id="task-list"></ul>
    </div>

    <h2>💰 Rewards</h2>
    <div id="rewards" class="box"></div>

    <button class="action" onclick="addTask()">Add Task</button>
  </div>

  <!-- Profile Section -->
  <div id="profile" class="section">
    <h2>👤 Profile</h2>
    <div class="box">
      Name: John Doe<br>
      Role: Member<br>
      Points: 10
    </div>
  </div>

  <!-- Prayer Requests Section -->
  <div id="prayers" class="section">
    <h2>🙏 Prayer Requests</h2>
    <textarea id="prayer-input" placeholder="Send your prayer request..."></textarea>
    <button class="action" onclick="addPrayer()">Send Prayer</button>
    <ul id="prayer-log" class="box"></ul>
  </div>

  <!-- Appointments Section -->
  <div id="appointments" class="section">
    <h2>📅 Appointments</h2>
    <ul class="box">
      <li>Meeting with Pastor - Tomorrow 10AM</li>
      <li>Choir Practice - Saturday 4PM</li>
    </ul>
  </div>

</div>

<!-- Bottom Navigation -->
<div id="bottom-nav">
  <button id="nav-dashboard" class="active" onclick="showSection('dashboard')">🏠 Home</button>
  <button id="nav-profile" onclick="showSection('profile')">👤 Profile</button>
  <button id="nav-prayers" onclick="showSection('prayers')">🙏 Prayers</button>
  <button id="nav-appointments" onclick="showSection('appointments')">📅 Appointments</button>
</div>

<script>
  // ---------- Navigation ----------
  function showSection(section){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-section'));
    document.getElementById(section).classList.add('active-section');

    // Bottom nav highlight
    document.querySelectorAll('#bottom-nav button').forEach(b=>b.classList.remove('active'));
    if(section==='dashboard') document.getElementById('nav-dashboard').classList.add('active');
    if(section==='profile') document.getElementById('nav-profile').classList.add('active');
    if(section==='prayers') document.getElementById('nav-prayers').classList.add('active');
    if(section==='appointments') document.getElementById('nav-appointments').classList.add('active');
  }

  // ---------- Tasks + Rewards ----------
  let tasks = [
    { name: "Task 1", status: "Pending" },
    { name: "Task 2", status: "Completed" }
  ];
  let points = 10;

  function renderTasks(){
    const ul = document.getElementById("task-list");
    ul.innerHTML = "";
    tasks.forEach((t,i)=>{
      const li = document.createElement("li");
      li.textContent = `${t.name} - ${t.status}`;
      ul.appendChild(li);
    });
  }

  function renderRewards(){
    document.getElementById("rewards").innerText = `You have earned: ${points} points`;
  }

  function addTask(){
    const nextNum = tasks.length + 1;
    tasks.push({ name: `Task ${nextNum}`, status: "Pending" });
    points += 5;
    renderTasks();
    renderRewards();
  }

  renderTasks();
  renderRewards();

  // ---------- Prayer Requests ----------
  let prayerRequests = [];

  function addPrayer(){
    const input = document.getElementById("prayer-input").value.trim();
    if(!input) return alert("Type your prayer request");
    prayerRequests.push(input);
    renderPrayerLog();
    document.getElementById("prayer-input").value = "";
  }

  function renderPrayerLog(){
    const ul = document.getElementById("prayer-log");
    ul.innerHTML = "";
    prayerRequests.forEach((p,i)=>{
      const li = document.createElement("li");
      li.textContent = `#${i+1} - ${p}`;
      ul.appendChild(li);
    });
  }
</script>

</body>
  </html>
