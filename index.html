<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church App Dashboard</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* BODY */
body {
  background: #000;
  color: #fff;
  min-height: 100vh;
}

/* HEADER */
.header {
  text-align: center;
  padding: 20px;
  border-bottom: 1px solid #222;
}

.header h1 {
  color: #ffd400;
  font-size: 28px;
  font-weight: bold;
}

/* CONTENT */
.container {
  padding: 15px;
  padding-bottom: 90px;
}

.section-title {
  color: #ffd400;
  font-size: 22px;
  margin: 15px 0;
}

/* CARDS */
.card {
  background: #111;
  border-radius: 15px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(255,212,0,0.15);
}

.card h3 {
  font-size: 16px;
  margin-bottom: 6px;
}

.card p {
  font-size: 14px;
  opacity: 0.8;
}

/* LIVE SERVICE */
.live {
  background: #000;
  border: 1px solid #222;
  height: 120px;
  border-radius: 15px;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #ffd400;
  display: flex;
  justify-content: space-around;
  padding: 12px 0;
}

.bottom-nav a {
  text-decoration: none;
  color: #000;
  font-weight: bold;
  font-size: 14px;
}

.bottom-nav a.active {
  border-bottom: 3px solid #000;
  padding-bottom: 4px;
}

/* LOADER FIX */
#loader {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #222;
  border-top: 4px solid #ffd400;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>CHURCH APP</h1>
</div>

<!-- CONTENT -->
<div class="container">
  <div class="section-title">Dashboard</div>

  <div class="card">
    <h3>💰 Total Donations</h3>
    <p>₦0 (demo)</p>
  </div>

  <div class="card">
    <h3>🎯 Active Campaigns</h3>
    <p>None yet</p>
  </div>

  <div class="card">
    <h3>📊 Donation Analytics</h3>
    <p>Coming soon</p>
  </div>

  <div class="card">
    <h3>👥 Total Members</h3>
    <p>0 (demo)</p>
  </div>

  <div class="card">
    <h3>📅 Upcoming Events</h3>
    <p>No events</p>
  </div>

  <div class="card">
    <h3>🔴 Live Service (Demo)</h3>
    <div class="live"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <a href="#" class="active">HOME</a>
  <a href="#">TASKS</a>
  <a href="#">REWARDS</a>
  <a href="#">DONATE</a>
</div>

<script>
/* REMOVE LOADER */
window.addEventListener("load", function () {
  document.getElementById("loader").style.display = "none";
});
</script>

</body>
  </html>
