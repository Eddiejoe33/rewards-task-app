<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: gold;
}

/* HEADER */
header {
  background: black;
  padding: 12px;
  text-align: center;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 1px solid gold;
}

/* MAIN CONTENT */
.container {
  padding: 15px;
  padding-bottom: 80px;
}

.section {
  margin-bottom: 20px;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

input, textarea {
  background: #111;
  color: gold;
  border: 1px solid gold;
}

button {
  background: gold;
  color: black;
  font-weight: bold;
  cursor: pointer;
}

/* BOTTOM NAV */
nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: black;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  border-top: 1px solid gold;
}

nav button {
  background: none;
  border: none;
  color: gold;
  font-size: 16px;
}
</style>
</head>

<body>

<header id="topTitle">Church</header>

<div class="container" id="content">

  <!-- Bible AI -->
  <div class="section">
    <h3>📖 King James Bible (AI)</h3>
    <input id="bibleInput" placeholder="Search Chapter:Verse (e.g., John 3:16)">
    <button onclick="readVerse()">Read Verse</button>
    <p id="bibleResult"></p>
  </div>

  <!-- Prayer -->
  <div class="section">
    <h3>🙏 Prayer Request</h3>
    <textarea placeholder="Type your prayer request..."></textarea>
    <button>Send Prayer</button>
  </div>

  <!-- Counseling -->
  <div class="section">
    <h3>💍 Marriage Counseling</h3>
    <textarea placeholder="Describe your counseling request..."></textarea>
    <button>Request Counseling</button>
  </div>

  <!-- Donation -->
  <div class="section">
    <h3>💰 Donation</h3>
    <input placeholder="Enter donation amount">
    <button>Donate</button>
  </div>

</div>

<!-- Bottom Navigation -->
<nav>
  <button onclick="showPage('Home')">🏠 Home</button>
  <button onclick="showPage('Profile')">👤 Profile</button>
  <button onclick="showPage('Activities')">⚡ Activities</button>
  <button onclick="showPage('Appointments')">📅 Appointments</button>
</nav>

<script>
// Change Top Title when clicking bottom buttons
function showPage(name) {
  document.getElementById("topTitle").innerText = name;
}

// AI Bible Reader (Simple Simulation)
function readVerse() {
  let verse = document.getElementById("bibleInput").value;
  document.getElementById("bibleResult").innerText =
    "📖 AI Reading of " + verse + ": (AI will speak this verse here)";
}
</script>

</body>
  </html>
