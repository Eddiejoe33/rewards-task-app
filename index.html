<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Rewards App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================= GLOBAL ================= */
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0b0b;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
  overflow: hidden; /* IMPORTANT */
}

/* ================= APP LAYOUT ================= */
#app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ================= HEADER ================= */
.header {
  flex-shrink: 0;
  height: 64px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,215,0,0.3);
}

.header img {
  width: 34px;
  height: 34px;
  border-radius: 50%;
}

.header h1 {
  margin: 0;
  color: gold;
  font-weight: 900;
  letter-spacing: 2px;
}

/* ================= MAIN (SCROLL AREA) ================= */
.main-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 16px;
  padding-bottom: 140px; /* space for bottom nav */
}

/* ================= SECTIONS ================= */
.section {
  display: none;
  min-height: calc(100vh - 64px - 90px);
}

.section.active {
  display: block;
}

/* ================= CARDS ================= */
.card {
  background: #1a1a1a;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 18px;
  box-shadow: 0 0 14px rgba(255,215,0,0.25);
}

/* ================= LIVE STREAM ================= */
.video-placeholder {
  height: 220px;
  background: linear-gradient(180deg, #000, #111);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: gold;
  font-weight: bold;
  letter-spacing: 1px;
}

.video-placeholder span {
  font-size: 13px;
  opacity: 0.8;
}

/* ================= SOCIAL PLACEHOLDER ================= */
.social-box {
  display: flex;
  justify-content: space-around;
  margin-top: 14px;
}

.social-box div {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  color: gold;
  font-size: 22px;
  border: 1px solid rgba(255,215,0,0.4);
}

/* ================= AUTH ================= */
#authBox {
  padding: 40px 20px;
  text-align: center;
}

input {
  padding: 12px;
  width: 90%;
  max-width: 320px;
  border-radius: 6px;
  border: none;
  margin-bottom: 12px;
}

button {
  background: gold;
  border: none;
  padding: 12px 16px;
  margin: 6px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
}

/* ================= BOTTOM NAV ================= */
.bottom-nav {
  flex-shrink: 0;
  height: 90px;
  background: gold;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
}

.bottom-nav button {
  background: none;
  border: none;
  font-size: 15px;
  font-weight: 900;
  color: #000;
  letter-spacing: 1px;
  position: relative;
  padding-bottom: 6px;
}

.bottom-nav button.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 4px;
  background: #000;
  border-radius: 2px;
}

/* ================= PROFILE ================= */
.profile-avatar {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  border: 3px solid gold;
  margin-bottom: 12px;
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authBox">
  <h2 style="color:gold">Login / Signup</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <div>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>
  <p id="authMsg"></p>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">

<header class="header">
  <img src="https://via.placeholder.com/100?text=LOGO">
  <h1>CHURCH APP</h1>
</header>

<main class="main-content">

<!-- DASHBOARD -->
<section id="homeSection" class="section active">
  <h2 style="color:gold">Dashboard</h2>

  <div class="card">💰 Total Donations<br>₦0 (demo)</div>
  <div class="card">🎯 Active Campaigns<br>None yet</div>
  <div class="card">📊 Donation Analytics<br>Coming soon</div>

  <div class="card">
    🔴 Live Service (Demo)
    <div class="video-placeholder">
      LIVE STREAM
      <span>Facebook • YouTube • TikTok</span>
    </div>

    <div class="social-box">
      <div>📘</div>
      <div>▶️</div>
      <div>🎵</div>
    </div>
  </div>
</section>

<!-- TASKS -->
<section id="tasksSection" class="section">
  <h2 style="color:gold">Tasks</h2>
  <div class="card">Verify donor payments</div>
</section>

<!-- REWARDS -->
<section id="rewardsSection" class="section">
  <h2 style="color:gold">Rewards</h2>
  <div class="card">🥇 Platinum Donor</div>
</section>

<!-- DONATE -->
<section id="givingSection" class="section">
  <h2 style="color:gold">Donations</h2>
  <div class="card">Payment gateway demo</div>
</section>

<!-- PROFILE -->
<section id="profileSection" class="section">
  <h2 style="color:gold">Profile</h2>
  <div class="card" style="text-align:center">
    <img class="profile-avatar" src="https://via.placeholder.com/150?text=LOGO">
    <p id="profileEmail"></p>
    <button onclick="logout()">Logout</button>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="active" onclick="showSection('home', this)">HOME</button>
  <button onclick="showSection('tasks', this)">TASKS</button>
  <button onclick="showSection('rewards', this)">REWARDS</button>
  <button onclick="showSection('giving', this)">DONATE</button>
  <button onclick="showSection('profile', this)">PROFILE</button>
</nav>

</div>

<!-- ================= SCRIPT ================= -->
<script type="module">
document.addEventListener("DOMContentLoaded", async () => {

  const authBox = document.getElementById("authBox");
  const appBox = document.getElementById("app");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const authMsg = document.getElementById("authMsg");
  const profileEmail = document.getElementById("profileEmail");

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
  const { getAuth, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword }
    = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};


  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.showSection = (name, btn) => {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(name + "Section").classList.add("active");
    document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  };

  signupBtn.onclick = () =>
    createUserWithEmailAndPassword(auth, email.value, password.value)
      .catch(e => authMsg.innerText = e.message);

  loginBtn.onclick = () =>
    signInWithEmailAndPassword(auth, email.value, password.value)
      .catch(e => authMsg.innerText = e.message);

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (user) {
      authBox.style.display = "none";
      appBox.style.display = "flex";
      profileEmail.textContent = user.email;
    }
  });
});
</script>

</body>
    </html>
