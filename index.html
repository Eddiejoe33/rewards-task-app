<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🙏 Church App</title>

<style>
/* ---------- General Styles ---------- */
body { 
  font-family: Arial, sans-serif; 
  background: #f0f2f5; 
  margin: 0; 
  padding: 0; 
  font-size: 20px; 
}

.container { 
  max-width: 900px; 
  margin: 20px auto; 
  background: #fff; 
  padding: 20px; 
  border-radius: 16px; 
  box-shadow: 0 6px 20px rgba(0,0,0,0.12); 
  padding-bottom: 120px;
}

/* ---------- Headings ---------- */
h1 { color: #2c3e50; font-size: 34px; text-align:center; }
h2 { font-size: 26px; margin-top: 20px; }

/* ---------- Boxes ---------- */
.box { 
  background: #f9f9f9; 
  border: 2px solid #ddd; 
  padding: 18px; 
  border-radius: 14px; 
  margin-top: 12px; 
  font-size: 22px; 
}

/* ---------- List ---------- */
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 14px; border-bottom: 1px solid #ddd; font-size: 22px; }
li:last-child { border-bottom: none; }

/* ---------- Buttons ---------- */
button.action { 
  background: #1abc9c; 
  margin-top: 15px; 
  width: 100%; 
  font-size: 24px; 
  padding: 16px; 
  border-radius: 14px; 
  color: #fff; 
  border: none; 
  font-weight: bold;
}

/* ---------- Inputs ---------- */
textarea { 
  width: 100%; 
  padding: 16px; 
  border-radius: 12px; 
  border: 2px solid #ccc; 
  font-size: 20px;
}

/* ---------- Sections ---------- */
.section { display: none; }
.active-section { display: block; }

/* ---------- Bottom Navigation ---------- */
#bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  display: flex;
  background: #2c3e50;
  justify-content: space-around;
  padding: 12px 0;
  box-shadow: 0 -3px 8px rgba(0,0,0,0.2);
}

#bottom-nav button {
  background: none;
  color: white;
  border: none;
  font-size: 20px;
  font-weight: bold;
  flex: 1;
}

#bottom-nav button.active {
  color: #1abc9c;
}
</style>
</head>

<body>

<div class="container">
  <h1>🙏 Church App</h1>

  <!-- Home Dashboard -->
  <div id="dashboard" class="section active-section">
    <h2>🗂 Tasks</h2>
    <div class="box">
      <ul id="task-list"></ul>
    </div>

    <h2>💰 Rewards</h2>
    <div id="rewards" class="box"></div>

    <button class="action" onclick="addTask()">➕ Add Task</button>
  </div>

  <!-- Profile -->
  <div id="profile" class="section">
    <h2>👤 Profile</h2>
    <div class="box">
      Name: John Doe<br>
      Role: Member<br>
      Points: 10
    </div>
  </div>

  <!-- Prayer -->
  <div id="prayers" class="section">
    <h2>🙏 Prayer Requests</h2>
    <textarea id="prayer-input" placeholder="Type your prayer request..."></textarea>
    <button class="action" onclick="addPrayer()">Send Prayer</button>
    <ul id="prayer-log" class="box"></ul>
  </div>

  <!-- Appointments -->
  <div id="appointments" class="section">
    <h2>📅 Appointments</h2>
    <div class="box">
      <li>Meeting with Pastor - Tomorrow 10AM</li>
      <li>Choir Practice - Saturday 4PM</li>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<div id="bottom-nav">
  <button id="nav-dashboard" class="active" onclick="showSection('dashboard')">🏠 Home</button>
  <button id="nav-profile" onclick="showSection('profile')">👤 Profile</button>
  <button id="nav-prayers" onclick="showSection('prayers')">🙏 Prayers</button>
  <button id="nav-appointments" onclick="showSection('appointments')">📅 Appointments</button>
</div>

<script>
// Navigation
function showSection(section){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-section'));
  document.getElementById(section).classList.add('active-section');

  document.querySelectorAll('#bottom-nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-' + section).classList.add('active');
}

// Tasks + Rewards
let tasks = [
  { name: "Task 1", status: "Pending" },
  { name: "Task 2", status: "Completed" }
];
let points = 10;

function renderTasks(){
  const ul = document.getElementById("task-list");
  ul.innerHTML = "";
  tasks.forEach(t=>{
    const li = document.createElement("li");
    li.textContent = `${t.name} - ${t.status}`;
    ul.appendChild(li);
  });
}

function renderRewards(){
  document.getElementById("rewards").innerText = `You have earned: ${points} points`;
}

function addTask(){
  const next = tasks.length + 1;
  tasks.push({ name: "Task " + next, status: "Pending" });
  points += 5;
  renderTasks();
  renderRewards();
}

renderTasks();
renderRewards();

// Prayer Requests
let prayers = [];
function addPrayer(){
  const text = document.getElementById("prayer-input").value.trim();
  if(!text) return alert("Type your prayer request");
  prayers.push(text);
  const ul = document.getElementById("prayer-log");
  const li = document.createElement("li");
  li.textContent = text;
  ul.appendChild(li);
  document.getElementById("prayer-input").value = "";
}
</script>

</body>
    </html>
