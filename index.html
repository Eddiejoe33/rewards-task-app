<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church App</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#000000">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #000;
    color: #fff;
}

.container {
    padding: 16px;
}

.card {
    background: #111;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

h2 {
    margin-top: 0;
}

button {
    background: #f5c400;
    border: none;
    padding: 10px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.task, .job {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #222;
}

iframe {
    width: 100%;
    height: 200px;
    border-radius: 12px;
    border: none;
}

/* Bottom Nav */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #000;
    display: flex;
    justify-content: space-around;
    padding: 10px 0;
    border-top: 1px solid #222;
}
</style>
</head>

<body>

<div class="container">

    <!-- Dashboard -->
    <div class="card">
        <h2>Dashboard</h2>
        <p>Email: joeledward949@gmail.com</p>
        <p>XP: <span id="xp">0</span></p>
        <button id="installBtn" style="display:none;">Install App</button>
    </div>

    <!-- Live Video (FIXED) -->
    <div class="card">
        <h2>📺 Live Stream</h2>
        <iframe 
          src="https://www.youtube.com/embed/5qap5aO4i9A"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
        <p style="opacity:0.6;">Live placeholder – connects to social platforms later</p>
    </div>

    <!-- Tasks -->
    <div class="card">
        <h2>📝 Tasks</h2>

        <div class="task">
            <span>Watch Live Stream</span>
            <button onclick="addXP()">Complete</button>
        </div>

        <div class="task">
            <span>Share App</span>
            <button onclick="addXP()">Complete</button>
        </div>

        <div class="task">
            <span>Invite Friend</span>
            <button onclick="addXP()">Complete</button>
        </div>
    </div>

    <!-- Remote Jobs -->
    <div class="card">
        <h2>💼 Remote Jobs</h2>

        <div class="job">
            <span>Frontend Developer</span>
            <button>Apply</button>
        </div>

        <div class="job">
            <span>QA Engineer</span>
            <button>Apply</button>
        </div>

        <div class="job">
            <span>Community Manager</span>
            <button>Apply</button>
        </div>
    </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <span>🏠</span>
    <span>📺</span>
    <span>📝</span>
    <span>👤</span>
</div>

<script>
/* XP Logic */
let xp = 0;
function addXP() {
    xp += 10;
    document.getElementById("xp").innerText = xp;
}

/* PWA Install */
let deferredPrompt;
const installBtn = document.getElementById("installBtn");

window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "inline-block";
});

installBtn.addEventListener("click", () => {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        installBtn.style.display = "none";
    });
});

/* Service Worker */
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
  </html>
