<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#000000" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
      padding-bottom: 80px;
    }

    .card {
      background: #111;
      border-radius: 16px;
      padding: 16px;
      margin: 16px;
    }

    h2 {
      margin-top: 0;
    }

    .task {
      display: flex;
      justify-content: space-between;
      margin: 10px 0;
      border-bottom: 1px solid #222;
      padding-bottom: 10px;
    }

    .btn {
      background: #f5c400;
      border: none;
      border-radius: 20px;
      padding: 8px 16px;
      font-weight: bold;
      cursor: pointer;
    }

    iframe {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      border: none;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #000;
      display: flex;
      justify-content: space-around;
      padding: 14px 0;
      border-top: 1px solid #222;
    }

    .bottom-nav button {
      background: none;
      border: none;
      color: #f5c400;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .install-btn {
      position: fixed;
      top: 12px;
      right: 12px;
      background: #f5c400;
      color: #000;
      border: none;
      padding: 10px 14px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
    }
  </style>
</head>

<body>

<button class="install-btn" id="installBtn">Install App</button>

<div class="card">
  <h2>Dashboard</h2>
  <p>Email: joeledward949@gmail.com</p>
  <p>XP: 0</p>
</div>

<div class="card">
  <h2>Tasks</h2>

  <div class="task">
    <span>Watch Live Stream</span>
    <button class="btn">Complete</button>
  </div>

  <div class="task">
    <span>Share App</span>
    <button class="btn">Complete</button>
  </div>

  <div class="task">
    <span>Invite Friend</span>
    <button class="btn">Complete</button>
  </div>
</div>

<div class="card">
  <h2>📺 Live Stream</h2>

  <iframe
    src="https://www.youtube.com/embed/jfKfPfyJRdk"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>

  <p style="opacity:.6">Live placeholder – connects to social platforms later</p>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button data-nav="home">Home</button>
  <button data-nav="live">Live</button>
  <button data-nav="tasks">Tasks</button>
  <button data-nav="profile">Profile</button>
</nav>

<script>
  // Bottom-nav behavior (ALL same as Profile)
  document.querySelectorAll(".bottom-nav button").forEach(btn => {
    btn.addEventListener("click", () => {
      alert(btn.textContent + " coming soon");
    });
  });

  // PWA install
  let deferredPrompt;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt = null;
    installBtn.style.display = "none";
  });

  // Service Worker
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
  }
</script>

</body>
    </html>
