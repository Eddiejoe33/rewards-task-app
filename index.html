<!DOCTYPE html>
<html lang="en">
<head>
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: gold;
}

/* HEADER */
header {
  text-align: center;
  padding: 12px;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 1px solid gold;
}

/* DASHBOARD BUTTONS */
.dashboard {
  padding: 15px;
  padding-bottom: 90px;
}

.card {
  background: #111;
  border: 1px solid gold;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 12px;
  font-size: 18px;
  cursor: pointer;
}

/* HIDDEN BOXES */
.box {
  display: none;
  margin-top: 10px;
}

input, textarea, button {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

input, textarea {
  background: black;
  color: gold;
  border: 1px solid gold;
}

button {
  background: gold;
  color: black;
  font-weight: bold;
}

/* BOTTOM NAV */
nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  background: black;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  border-top: 1px solid gold;
}

nav button {
  background: none;
  border: none;
  color: gold;
  font-size: 16px;
}
</style>
</head>

<body>

<header id="title">Church</header>

<div class="dashboard">

<!-- Bible -->
<div class="card" onclick="toggleBox('bibleBox')">📖 King James Bible (AI)</div>
<div class="box" id="bibleBox">
  <input id="bibleInput" placeholder="Search Chapter:Verse (John 3:16)">
  <button onclick="readVerse()">Read Verse</button>
  <p id="bibleResult"></p>
</div>

<!-- Prayer -->
<div class="card" onclick="toggleBox('prayerBox')">🙏 Prayer Request</div>
<div class="box" id="prayerBox">
  <textarea placeholder="Type your prayer request..."></textarea>
  <button>Send Prayer</button>
</div>

<!-- Counseling -->
<div class="card" onclick="toggleBox('counselBox')">💍 Marriage Counseling</div>
<div class="box" id="counselBox">
  <textarea placeholder="Describe your counseling request..."></textarea>
  <button>Request Counseling</button>
</div>

<!-- Donation -->
<div class="card" onclick="toggleBox('donateBox')">💰 Donation</div>
<div class="box" id="donateBox">
  <input placeholder="Enter donation amount">
  <button>Donate</button>
</div>

</div>

<!-- Bottom Navigation -->
<nav>
  <button onclick="setTitle('Home')">🏠 Home</button>
  <button onclick="setTitle('Profile')">👤 Profile</button>
  <button onclick="setTitle('Activities')">⚡ Activities</button>
  <button onclick="setTitle('Appointments')">📅 Appointments</button>
</nav>

<script>
// Toggle show/hide boxes
function toggleBox(id) {
  let box = document.getElementById(id);
  box.style.display = box.style.display === "block" ? "none" : "block";
}

// Change top title
function setTitle(name) {
  document.getElementById("title").innerText = name;
}

// AI Bible Reader (fake for now)
function readVerse() {
  let v = document.getElementById("bibleInput").value;
  document.getElementById("bibleResult").innerText =
    "📖 AI Reading of " + v + ": (AI will speak the verse here)";
}
</script>

</body>
  </html>
