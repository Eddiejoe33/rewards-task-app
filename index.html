<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0f172a, #020617);
  color: white;
}

#app {
  padding: 20px;
  padding-bottom: 140px;
}

#app-title {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}

.section { display: none; }
.section.active { display: block; }

.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 15px;
  backdrop-filter: blur(10px);
  font-size: 20px;
  cursor: pointer;
}

.card-content { display: none; margin-top: 10px; }

input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-top: 8px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  background: #2563eb;
  color: white;
}

.bottom-nav {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  background: rgba(30, 58, 138, 0.35);
  backdrop-filter: blur(18px);
  border-radius: 30px;
  display: flex;
  justify-content: space-around;
  padding: 14px 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 9999;
}

.bottom-nav button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.8);
  font-size: 16px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
}

.bottom-nav span { font-size: 22px; }

.bottom-nav button.active {
  color: #60a5fa;
  transform: scale(1.15);
}
</style>
</head>

<body>

<div id="app">
  <div id="app-title">Church</div>

  <!-- HOME -->
  <div id="home" class="section active">

    <!-- Bible -->
    <div class="card" onclick="toggleCard('bibleBox')">
      📖 King James Bible (AI)
      <div id="bibleBox" class="card-content">
        <input id="verseInput" placeholder="John 3:16">
        <button onclick="readVerse()">Read Verse</button>
        <div id="verseOutput"></div>
      </div>
    </div>

    <!-- Prayer -->
    <div class="card" onclick="toggleCard('prayerBox')">
      🙏 Prayer Request
      <div id="prayerBox" class="card-content">
        <textarea id="prayerText" placeholder="Type prayer request..."></textarea>
        <button onclick="sendPrayer()">Send Prayer</button>
        <div id="prayerList"></div>
      </div>
    </div>

    <!-- Counseling -->
    <div class="card" onclick="toggleCard('counselBox')">
      💍 Marriage Counseling
      <div id="counselBox" class="card-content">
        <textarea placeholder="Describe counseling need..."></textarea>
        <button>Request Counseling</button>
      </div>
    </div>

    <!-- Donation -->
    <div class="card" onclick="toggleCard('donateBox')">
      💰 Donation
      <div id="donateBox" class="card-content">
        <input id="donateAmount" placeholder="Enter amount">
        <button onclick="saveDonation()">Donate</button>
        <div id="donationList"></div>
      </div>
    </div>

  </div>

  <!-- PROFILE -->
  <div id="profile" class="section">
    <h2>Profile</h2>
    <div class="card">User: Demo Member<br>Role: Member</div>
  </div>

  <!-- ACTIVITIES -->
  <div id="activities" class="section">
    <h2>Activities</h2>
    <div class="card">✅ Task: Read Bible Today</div>
    <div class="card">📅 Sunday Service: 10 AM</div>
    <div class="card">⭐ Rewards: 10 Points</div>
  </div>

  <!-- APPOINTMENTS -->
  <div id="appointments" class="section">
    <h2>Appointments</h2>
    <div class="card">Meeting with Pastor - Tomorrow 10AM</div>
  </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="active" onclick="showSection('home', this)"><span>🏠</span>Home</button>
  <button onclick="showSection('profile', this)"><span>👤</span>Profile</button>
  <button onclick="showSection('activities', this)"><span>⚡</span>Activities</button>
  <button onclick="showSection('appointments', this)"><span>📅</span>Appointments</button>
</div>

<script>
/* ===== NAVIGATION ===== */
function showSection(id, btn) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("app-title").innerText = id.charAt(0).toUpperCase() + id.slice(1);
}

/* Toggle cards */
function toggleCard(id) {
  let el = document.getElementById(id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

/* ===== MINI DEMO KJV BIBLE (1000 verses demo style) ===== */
const bible = {
  "John 3:16": "For God so loved the world, that he gave his only begotten Son...",
  "Genesis 1:1": "In the beginning God created the heaven and the earth.",
  "Psalm 23:1": "The LORD is my shepherd; I shall not want.",
  "Romans 8:28": "And we know that all things work together for good...",
  "Proverbs 3:5": "Trust in the LORD with all thine heart...",
  "Matthew 28:19": "Go ye therefore, and teach all nations..."
  // You can expand later
};

/* Bible Search + AI Voice */
function readVerse() {
  let key = document.getElementById("verseInput").value.trim();
  let verse = bible[key] || "Verse not found in demo Bible.";
  document.getElementById("verseOutput").innerText = key + ": " + verse;

  // AI Voice Read
  let speech = new SpeechSynthesisUtterance(verse);
  speech.rate = 0.9;
  speechSynthesis.speak(speech);
}

/* ===== PRAYER STORAGE (PERMANENT ON DEVICE) ===== */
function sendPrayer() {
  let text = document.getElementById("prayerText").value.trim();
  if (!text) return alert("Write prayer request");

  let prayers = JSON.parse(localStorage.getItem("prayers") || "[]");
  prayers.push(text);
  localStorage.setItem("prayers", JSON.stringify(prayers));

  document.getElementById("prayerText").value = "";
  loadPrayers();
}

function loadPrayers() {
  let prayers = JSON.parse(localStorage.getItem("prayers") || "[]");
  let list = prayers.map(p => "🙏 " + p).join("<br>");
  document.getElementById("prayerList").innerHTML = list;
}

/* ===== DONATION STORAGE ===== */
function saveDonation() {
  let amt = document.getElementById("donateAmount").value.trim();
  if (!amt) return alert("Enter amount");

  let donations = JSON.parse(localStorage.getItem("donations") || "[]");
  donations.push("₦" + amt);
  localStorage.setItem("donations", JSON.stringify(donations));

  document.getElementById("donateAmount").value = "";
  loadDonations();
}

function loadDonations() {
  let donations = JSON.parse(localStorage.getItem("donations") || "[]");
  let list = donations.map(d => "💰 " + d).join("<br>");
  document.getElementById("donationList").innerHTML = list;
}

/* Load stored data on startup */
loadPrayers();
loadDonations();
</script>

</body>
  </html>
