<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>FULL MVP APP</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>

<body class="bg-gray-100 text-gray-800">

<header class="bg-blue-600 text-white p-4 text-center text-lg font-semibold">
  FULL MVP APP
</header>

<main class="p-4 pb-24">

  <!-- HOME -->
  <section id="homeSection">
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <p class="text-sm text-gray-500">Your Points</p>
      <h2 id="xp" class="text-2xl font-bold text-blue-600">320 XP</h2>
    </div>

    <div class="bg-white rounded-xl shadow p-4 mb-3 flex justify-between">
      <div>
        <p class="font-medium">Daily Task</p>
        <p class="text-sm text-gray-500">+20 XP</p>
      </div>
      <button id="dailyTask" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Start</button>
    </div>

    <div class="bg-white rounded-xl shadow p-4 flex justify-between">
      <div>
        <p class="font-medium">Invite Friend</p>
        <p class="text-sm text-gray-500">+50 XP</p>
      </div>
      <button id="inviteTask" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Start</button>
    </div>
  </section>

  <!-- TASKS -->
  <section id="tasksSection" class="hidden">
    <h3 class="font-semibold mb-2">Tasks</h3>
    <p>More tasks coming soon.</p>
  </section>

  <!-- REWARDS -->
  <section id="rewardsSection" class="hidden">
    <div class="bg-white rounded-xl shadow p-4 flex justify-between">
      <div>
        <p class="font-medium">Gift Voucher</p>
        <p class="text-sm text-gray-500">200 XP</p>
      </div>
      <button id="redeemBtn" class="border border-blue-600 text-blue-600 px-4 py-2 rounded-lg">
        Redeem
      </button>
    </div>
  </section>

  <!-- PROFILE -->
  <section id="profileSection" class="hidden">
    <p>User profile info</p>
  </section>

</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3">
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('tasks')">Tasks</button>
  <button onclick="showSection('rewards')">Rewards</button>
  <button onclick="showSection('profile')">Profile</button>
</nav>

<script>
let xp = 320;

function updateXP() {
  document.getElementById("xp").innerText = xp + " XP";
}

document.getElementById("dailyTask").onclick = () => {
  xp += 20;
  updateXP();
  alert("+20 XP");
};

document.getElementById("inviteTask").onclick = () => {
  xp += 50;
  updateXP();
  alert("+50 XP");
};

document.getElementById("redeemBtn").onclick = () => {
  if (xp >= 200) {
    xp -= 200;
    updateXP();
    alert("Redeemed!");
  } else {
    alert("Not enough XP");
  }
};

function showSection(name) {
  ["home","tasks","rewards","profile"].forEach(s =>
    document.getElementById(s + "Section").classList.add("hidden")
  );
  document.getElementById(name + "Section").classList.remove("hidden");
}
</script>

</body>
    </html>
