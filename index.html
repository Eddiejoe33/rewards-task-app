<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church App</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    padding-bottom: 90px;
}

.container {
    padding: 16px;
}

.card {
    background: #111;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
}

h2 {
    margin: 0 0 12px;
}

/* TASKS */
.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #222;
}

.task:last-child {
    border-bottom: none;
}

.task button {
    background: #f5c400;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
}

/* BOTTOM NAV (TEXT ONLY) */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #000;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 9999;
}

.bottom-nav button {
    background: none;
    border: none;
    color: #f5c400;
    font-size: 14px;
    font-weight: bold;
}

/* IFRAME */
iframe {
    width: 100%;
    height: 220px;
    border-radius: 12px;
    border: none;
}
</style>
</head>

<body>

<div class="container" id="top">

    <!-- DASHBOARD -->
    <div class="card">
        <h2>Dashboard</h2>
        <p>Email: joeledward949@gmail.com</p>
        <p>XP: <span id="xp">0</span></p>
    </div>

    <!-- TASKS -->
    <div class="card" id="tasks">
        <h2>📝 Tasks</h2>

        <div class="task">
            <span>Watch Live Stream</span>
            <button onclick="addXP()">Complete</button>
        </div>

        <div class="task">
            <span>Share App</span>
            <button onclick="addXP()">Complete</button>
        </div>

        <div class="task">
            <span>Invite Friend</span>
            <button onclick="addXP()">Complete</button>
        </div>
    </div>

    <!-- LIVE STREAM (NOW BELOW TASKS) -->
    <div class="card" id="live">
        <h2>📺 Live Stream</h2>

        <iframe 
            src="https://www.youtube.com/embed/jfKfPfyJRdk"
            allowfullscreen>
        </iframe>

        <p style="opacity:.7;margin-top:8px">
            Live placeholder – connects to social platforms later
        </p>
    </div>

    <!-- MEDICAL & WELLNESS -->
    <div class="card" id="medical">
        <h2>🩺 Medical & Wellness</h2>
        <p>Daily health tips, prayer support & wellness guidance coming soon.</p>
    </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <button onclick="scrollToSection('top')">Home</button>
    <button onclick="scrollToSection('live')">Live</button>
    <button onclick="scrollToSection('tasks')">Tasks</button>
    <button onclick="scrollToSection('medical')">Profile</button>
</div>

<script>
let xp = 0;

function addXP() {
    xp += 10;
    document.getElementById('xp').innerText = xp;
}

function scrollToSection(id) {
    document.getElementById(id).scrollIntoView({behavior: 'smooth'});
}
</script>

</body>
</html>
