<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pastor AI Secretary MVP</title>
<style>
  body { font-family: Arial; background:#f4f6f9; padding:20px; }
  .container { max-width:800px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
  h1 { color:#2c3e50; }
  .box { border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px; white-space:pre-wrap; }
  input, button { padding:10px; width:100%; margin-top:5px; }
  button { background:#2c3e50; color:white; border:none; cursor:pointer; }
  button:hover { background:black; }
  #debug { font-size:12px; color:red; margin-top:10px; }
</style>
</head>
<body>

<div class="container">
  <h1>🙏 Pastor AI Secretary MVP</h1>

  <h2>👥 Church Members Dashboard</h2>
  <div id="users" class="box">Loading church members...</div>

  <h2>🤖 Ask Pastor AI</h2>
  <input id="question" placeholder="Ask your pastor anything...">
  <button onclick="askAI()">Ask AI</button>
  <div id="ai-answer" class="box"></div>

  <h3>Debug Info</h3>
  <div id="debug" class="box"></div>
</div>

<!-- Supabase v2 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ----------- SUPABASE SETUP -----------
  const supabaseUrl = "https://dwxmhgrysyvaahgcarth.supabase.co";
  const supabaseKey = "sb_publishable_SrRfZegLOPLOPG8DEG6kyw_FYzuuudh"; // Publishable key
  const supabase = supabase.createClient(supabaseUrl, supabaseKey);

  // ----------- LOAD USERS -----------
  async function loadUsers() {
    const el = document.getElementById("users");
    const debugEl = document.getElementById("debug");
    el.innerText = "Loading church members...";
    debugEl.innerText = "";

    try {
      const { data, error } = await supabase.from("users").select("*");
      debugEl.innerText = "Supabase fetch complete\nDATA: " + JSON.stringify(data) + "\nERROR: " + JSON.stringify(error);

      if (error) {
        el.innerText = "Supabase error: " + error.message;
        return;
      }

      if (!data || data.length === 0) {
        el.innerText = "No users found! Check your Supabase table.";
        return;
      }

      // Print users
      el.innerText = data.map(u => `${u.name} - ${u.role}`).join("\n");

    } catch (err) {
      el.innerText = "Fetch failed: " + err.message;
      debugEl.innerText += "\nCatch error: " + err.message;
    }
  }

  loadUsers();

  // ----------- AI DEMO -----------
  function askAI() {
    const q = document.getElementById("question").value.trim();
    if (!q) return alert("Type a question first.");
    document.getElementById("ai-answer").innerText = "Pastor AI received: " + q;
  }
</script>

</body>
</html>
