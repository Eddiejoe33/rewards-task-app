<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Church Rewards App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #f5f5f5;
}

/* ===== APP ===== */
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* ===== HEADER ===== */
.header {
  background: #111;
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,215,0,0.3);
}

.header img {
  width: 36px;
  height: 36px;
  border-radius: 50%;
}

.header h1 {
  margin: 0;
  color: gold;
  font-weight: 900;
  letter-spacing: 2px;
}

/* ===== MAIN ===== */
.main-content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 130px;
}

/* ===== SECTIONS ===== */
.section { display: none; }
.section.active { display: block; }

/* ===== CARDS ===== */
.card {
  background: #1a1a1a;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 18px;
  box-shadow: 0 0 14px rgba(255,215,0,0.2);
}

/* ===== VIDEO ===== */
.video-placeholder {
  height: 180px;
  background: #000;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: gold;
  margin: 14px 0;
}

/* ===== AUTH ===== */
#authBox {
  padding: 40px 20px;
  text-align: center;
}

input {
  padding: 12px;
  width: 90%;
  max-width: 320px;
  border-radius: 6px;
  border: none;
  margin-bottom: 12px;
}

button {
  background: gold;
  border: none;
  padding: 12px 16px;
  margin: 6px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 90px;
  background: gold;
  display: flex;
  justify-content: space-evenly;
  align-items: center;
}

.bottom-nav button {
  background: none;
  border: none;
  font-size: 15px;
  font-weight: 900;
  color: #000;
  letter-spacing: 1px;
  padding-bottom: 6px;
  cursor: pointer;
  position: relative;
}

/* 🔥 ACTIVE TAB INDICATOR */
.bottom-nav button.active {
  color: #000;
}

.bottom-nav button.active::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 20%;
  width: 60%;
  height: 4px;
  background: #000;
  border-radius: 2px;
}

/* ===== PROFILE AVATAR ===== */
.profile-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  margin-bottom: 10px;
  border: 3px solid gold;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox">
  <h2 style="color:gold">Login / Signup</h2>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <div>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>
  <p id="authMsg"></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header class="header">
  <img src="https://via.placeholder.com/100x100.png?text=LOGO" />
  <h1>CHURCH APP</h1>
</header>

<main class="main-content">

<section id="homeSection" class="section active">
  <h2 style="color:gold">Dashboard</h2>
  <div class="card">💰 Total Donations<br>₦0 (demo)</div>
  <div class="card">🎯 Active Campaigns<br>None yet</div>
  <div class="card">📊 Donation Analytics<br>Coming soon</div>

  <div class="card">
    🔴 Live Service (Demo)
    <div class="video-placeholder">LIVE STREAM</div>
  </div>
</section>

<section id="tasksSection" class="section">
  <h2 style="color:gold">Tasks</h2>
  <div class="card">Verify donor payments</div>
</section>

<section id="rewardsSection" class="section">
  <h2 style="color:gold">Rewards</h2>
  <div class="card">🥇 Platinum Donor</div>
</section>

<section id="givingSection" class="section">
  <h2 style="color:gold">Donations</h2>
  <div class="card">Payment gateway demo</div>
</section>

<section id="profileSection" class="section">
  <h2 style="color:gold">Profile</h2>
  <div class="card" style="text-align:center">
    <img class="profile-avatar" src="https://via.placeholder.com/150.png?text=LOGO">
    <div>Email: <span id="profileEmail"></span></div>
    <br>
    <button onclick="logout()">Logout</button>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="active" onclick="showSection('home', this)">HOME</button>
  <button onclick="showSection('tasks', this)">TASKS</button>
  <button onclick="showSection('rewards', this)">REWARDS</button>
  <button onclick="showSection('giving', this)">DONATE</button>
  <button onclick="showSection('profile', this)">PROFILE</button>
</nav>

</div>

<script type="module">
document.addEventListener("DOMContentLoaded", async () => {

  const authBox = document.getElementById("authBox");
  const appBox = document.getElementById("app");

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
  const { getAuth, onAuthStateChanged, signOut } =
    await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");

  const firebaseConfig = {
    apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
    authDomain: "rewards-task-mvp.firebaseapp.com",
    projectId: "rewards-task-mvp",
    appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window.showSection = (name, btn) => {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.getElementById(name + "Section").classList.add("active");

    document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  };

  window.logout = () => signOut(auth);

  onAuthStateChanged(auth, user => {
    if (user) {
      authBox.style.display = "none";
      appBox.style.display = "flex";
      profileEmail.innerText = user.email;
    }
  });
});
</script>

</body>
  </html>
