<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Secretary MVP</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Styles -->
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 500px;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    #chatBox {
      background: #111827;
      padding: 10px;
      height: 250px;
      overflow-y: auto;
      border-radius: 10px;
      margin-bottom: 10px;
      border: 1px solid #1f2937;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #16a34a;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🤖 AI Secretary MVP</h1>
    <p>Ask your AI Secretary</p>

    <div id="chatBox"></div>

    <input id="userInput" placeholder="Ask your secretary anything..." />
    <button onclick="askAI()">Ask AI</button>
  </div>

  <script src="script.js"></script>
</body>
  </html>
