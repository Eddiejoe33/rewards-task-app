<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards Task MVP</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  color: #222;
}

/* NAV */
nav {
  background: #111;
  color: #fff;
  display: flex;
  gap: 8px;
  padding: 10px;
  position: sticky;
  top: 0;
}

nav button {
  background: #222;
  color: #fff;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
}

nav button:hover {
  background: #444;
}

/* AUTH */
#authBox {
  max-width: 400px;
  margin: 60px auto;
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
}

button.primary {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.msg {
  text-align: center;
  margin-top: 10px;
  color: green;
}

/* SECTIONS */
section {
  display: none;
  padding: 20px;
}

section.active {
  display: block;
}

/* DASHBOARD */
.card {
  background: #fff;
  padding: 20px;
  border-radius: 10px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.xp {
  font-size: 22px;
  font-weight: bold;
}

/* TASK BUTTONS */
.task-btn {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  cursor: pointer;
  background: #007bff;
  color: #fff;
}

.task-btn.secondary {
  background: #28a745;
}

.task-btn.danger {
  background: #dc3545;
}

.logout {
  background: #dc3545;
}
</style>
</head>

<body>

<nav id="navBar" style="display:none">
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('tasks')">Tasks</button>
  <button onclick="showSection('rewards')">Rewards</button>
  <button onclick="showSection('profile')">Profile</button>
  <button onclick="showSection('giving')">Giving</button>
  <button class="logout" onclick="logout()">Logout</button>
</nav>

<!-- AUTH -->
<div id="authBox">
  <h2>Login / Sign Up</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="primary" id="signupBtn">Sign Up</button>
  <button class="primary" id="loginBtn">Login</button>
  <div class="msg" id="authMsg"></div>
</div>

<!-- HOME -->
<section id="homeSection">
  <div class="card">
    <h2>Dashboard</h2>
    <p class="xp" id="xp">0 XP</p>
  </div>
</section>

<!-- TASKS -->
<section id="tasksSection">
  <div class="card">
    <h3>Daily Task</h3>
    <button class="task-btn" id="dailyTask">Complete (+20 XP)</button>
  </div>

  <div class="card">
    <h3>Invite Friend</h3>
    <button class="task-btn secondary" id="inviteTask">Invite (+50 XP)</button>
  </div>
</section>

<!-- REWARDS -->
<section id="rewardsSection">
  <div class="card">
    <h3>Redeem Reward</h3>
    <button class="task-btn danger" id="redeemBtn">Redeem 200 XP</button>
  </div>
</section>

<!-- PROFILE -->
<section id="profileSection">
  <div class="card">
    <h3>Profile</h3>
    <p id="profileEmail"></p>
  </div>
</section>

<!-- GIVING -->
<section id="givingSection">
  <div class="card">
    <h3>Giving</h3>
    <p>Support good causes 🙏</p>
  </div>
</section>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 REPLACE WITH YOUR REAL FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};
  alizeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let xp = 0;

/* NAV */
window.showSection = (name) => {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Section").classList.add("active");
};

/* AUTH */
signupBtn.onclick = async () => {
  const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);
  await setDoc(doc(db, "users", cred.user.uid), {
    email: cred.user.email,
    xp: 0
  });
};

loginBtn.onclick = async () => {
  await signInWithEmailAndPassword(auth, email.value, password.value);
};

window.logout = async () => {
  await signOut(auth);
};

/* XP */
async function loadXP(uid) {
  const snap = await getDoc(doc(db, "users", uid));
  xp = snap.data().xp || 0;
  document.getElementById("xp").innerText = xp + " XP";
}

async function saveXP(uid) {
  await updateDoc(doc(db, "users", uid), { xp });
}

/* TASKS */
dailyTask.onclick = async () => {
  xp += 20;
  document.getElementById("xp").innerText = xp + " XP";
  saveXP(auth.currentUser.uid);
};

inviteTask.onclick = async () => {
  xp += 50;
  document.getElementById("xp").innerText = xp + " XP";
  saveXP(auth.currentUser.uid);
};

redeemBtn.onclick = async () => {
  if (xp >= 200) {
    xp -= 200;
    alert("Reward redeemed 🎉");
    saveXP(auth.currentUser.uid);
    document.getElementById("xp").innerText = xp + " XP";
  } else {
    alert("Not enough XP");
  }
};

/* STATE */
onAuthStateChanged(auth, user => {
  if (user) {
    authBox.style.display = "none";
    navBar.style.display = "flex";
    profileEmail.innerText = user.email;
    loadXP(user.uid);
  } else {
    authBox.style.display = "block";
    navBar.style.display = "none";
  }
});
</script>

</body>
  </html>
