<script type="module">
/* =========================
   SAFE FIREBASE BOOTSTRAP
========================= */

console.log("App starting...");

// --- DOM READY CHECK ---
const authBox = document.getElementById("authBox");
const navBar = document.getElementById("navBar");
const authMsg = document.getElementById("authMsg");<body>

  <!-- ================= AUTH BOX ================= -->
  <div id="authBox" style="max-width:400px;margin:40px auto;padding:20px;background:#111;border-radius:12px;">
    <h2 style="color:#f5c86a;text-align:center;">Login / Sign Up</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;"
    />

    <input
      id="password"
      type="password"
      placeholder="Password"
      style="width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;"
    />

    <button
      id="signupBtn"
      style="width:100%;padding:12px;margin-top:10px;background:#f5c86a;border:none;border-radius:8px;font-weight:bold;"
    >
      Sign Up
    </button>

    <button
      id="loginBtn"
      style="width:100%;padding:12px;margin-top:10px;background:#f5c86a;border:none;border-radius:8px;font-weight:bold;"
    >
      Login
    </button>

    <button
      id="resetBtn"
      style="width:100%;padding:10px;margin-top:10px;background:#333;color:#f5c86a;border:none;border-radius:8px;"
    >
      Forgot Password?
    </button>

    <p id="authMsg" style="color:#f5c86a;text-align:center;margin-top:10px;"></p>
  </div>

  <!-- ================= NAV BAR ================= -->
  <nav
    id="navBar"
    style="display:none;justify-content:space-around;padding:12px;background:#111;color:#f5c86a;"
  >
    <button onclick="showSection('home')">Home</button>
    <button onclick="showSection('tasks')">Tasks</button>
    <button onclick="showSection('rewards')">Rewards</button>
    <button onclick="showSection('giving')">Giving</button>
    <button onclick="showSection('profile')">Profile</button>
    <button onclick="logout()">Logout</button>
  </nav>

  <!-- ================= APP SECTIONS ================= -->
  <main style="padding:16px;">

    <section id="homeSection" class="active">
      <h3>Home</h3>
      <p>Welcome to your dashboard.</p>
    </section>

    <section id="tasksSection" style="display:none;">
      <h3>Tasks</h3>
      <p>Your tasks will appear here.</p>
    </section>

    <section id="rewardsSection" style="display:none;">
      <h3>Rewards</h3>
      <p>Your rewards will appear here.</p>
    </section>

    <section id="givingSection" style="display:none;">
      <h3>Giving</h3>
      <p>Donation & giving section.</p>
    </section>

    <section id="profileSection" style="display:none;">
      <h3>Profile</h3>
      <p>Email: <span id="profileEmail"></span></p>
    </section>

  </main>

</body>
