<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church</title>

<style>

/* ===== GLOBAL STYLE ===== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #0f172a, #020617);
  color: white;
}

/* App container */
#app {
  padding: 20px;
  padding-bottom: 140px;
}

/* Top title */
#app-title {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 15px;
}

/* Sections */
.section {
  display: none;
}

.section.active {
  display: block;
}

/* Clickable cards */
.card {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  padding: 18px;
  border-radius: 18px;
  margin-bottom: 15px;
  backdrop-filter: blur(10px);
  font-size: 20px;
  cursor: pointer;
}

/* Hidden content inside cards */
.card-content {
  display: none;
  margin-top: 10px;
}

/* Inputs */
input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  margin-top: 8px;
}

/* Buttons */
button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-size: 16px;
  font-weight: bold;
  margin-top: 10px;
  background: #2563eb;
  color: white;
}

/* ===== iPHONE GLASS BOTTOM NAV ===== */
.bottom-nav {
  position: fixed;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 92%;
  background: rgba(30, 58, 138, 0.35);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 30px;
  display: flex;
  justify-content: space-around;
  padding: 14px 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
  z-index: 9999;
}

.bottom-nav button {
  background: none;
  border: none;
  color: rgba(255,255,255,0.8);
  font-size: 16px;
  font-weight: 600;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
}

.bottom-nav span {
  font-size: 22px;
}

.bottom-nav button.active {
  color: #60a5fa;
  transform: scale(1.15);
}

</style>
</head>

<body>

<div id="app">
  <div id="app-title">Church</div>

  <!-- HOME -->
  <div id="home" class="section active">

    <div class="card" onclick="toggleCard('bibleBox')">
      📖 King James Bible (AI)
      <div id="bibleBox" class="card-content">
        <input id="verseInput" placeholder="John 3:16">
        <button onclick="readVerse()">Read Verse</button>
        <div id="verseOutput"></div>
      </div>
    </div>

    <div class="card" onclick="toggleCard('prayerBox')">
      🙏 Prayer Request
      <div id="prayerBox" class="card-content">
        <textarea id="prayerText" placeholder="Type prayer request..."></textarea>
        <button onclick="sendPrayer()">Send Prayer</button>
      </div>
    </div>

    <div class="card" onclick="toggleCard('counselBox')">
      💍 Marriage Counseling
      <div id="counselBox" class="card-content">
        <textarea placeholder="Describe counseling need..."></textarea>
        <button>Request Counseling</button>
      </div>
    </div>

    <div class="card" onclick="toggleCard('donateBox')">
      💰 Donation
      <div id="donateBox" class="card-content">
        <input placeholder="Enter amount">
        <button>Donate</button>
      </div>
    </div>

  </div>

  <!-- PROFILE -->
  <div id="profile" class="section">
    <h2>Profile</h2>
    <div class="card">User: Demo Member<br>Role: Member</div>
  </div>

  <!-- ACTIVITIES -->
  <div id="activities" class="section">
    <h2>Activities</h2>
    <div class="card">✅ Task: Read Bible Today</div>
    <div class="card">📅 Sunday Service: 10 AM</div>
    <div class="card">⭐ Rewards: 10 Points</div>
  </div>

  <!-- APPOINTMENTS -->
  <div id="appointments" class="section">
    <h2>Appointments</h2>
    <div class="card">Meeting with Pastor - Tomorrow 10AM</div>
  </div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" onclick="showSection('home', this)"><span>🏠</span>Home</button>
  <button onclick="showSection('profile', this)"><span>👤</span>Profile</button>
  <button onclick="showSection('activities', this)"><span>⚡</span>Activities</button>
  <button onclick="showSection('appointments', this)"><span>📅</span>Appointments</button>
</div>

<script>

/* Switch sections + change title */
function showSection(id, btn) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");

  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("app-title").innerText = id.charAt(0).toUpperCase() + id.slice(1);
}

/* Toggle card content */
function toggleCard(id) {
  let el = document.getElementById(id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

/* Fake AI Bible Reader */
function readVerse() {
  let v = document.getElementById("verseInput").value;
  document.getElementById("verseOutput").innerText =
    "📖 AI Reading of " + v + ": This is a simulated AI Bible verse reading.";
}

/* Prayer submit */
function sendPrayer() {
  alert("Prayer sent successfully 🙏");
}

</script>

</body>
  </html>
