<script type="module">
  // 🔥 Firebase v9 Modular SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

  // ✅ TODO: REPLACE WITH YOUR REAL CONFIG
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    appId: "YOUR_APP_ID"
  };

  // Init
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Elements
  const authBox = document.getElementById("authBox");
  const navBar = document.getElementById("navBar");
  const authMsg = document.getElementById("authMsg");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const signupBtn = document.getElementById("signupBtn");
  const loginBtn = document.getElementById("loginBtn");
  const resetBtn = document.getElementById("resetBtn");

  // Sections
  const sections = {
    home: document.getElementById("homeSection"),
    tasks: document.getElementById("tasksSection"),
    rewards: document.getElementById("rewardsSection"),
    profile: document.getElementById("profileSection"),
    giving: document.getElementById("givingSection")
  };

  // Helpers
  window.showSection = (name) => {
    Object.values(sections).forEach(s => s.classList.remove("active"));
    sections[name + "Section"]?.classList.add("active");
  };

  function showApp(user) {
    authBox.style.display = "none";
    navBar.style.display = "flex";
    document.getElementById("profileEmail").innerText = user.email;
    showSection("home");
  }

  function showAuth() {
    authBox.style.display = "block";
    navBar.style.display = "none";
  }

  // Auth state
  onAuthStateChanged(auth, (user) => {
    if (user) showApp(user);
    else showAuth();
  });

  // Sign Up
  signupBtn.onclick = async () => {
    authMsg.innerText = "Creating account...";
    try {
      await createUserWithEmailAndPassword(
        auth,
        emailInput.value,
        passwordInput.value
      );
      authMsg.innerText = "Account created successfully 🎉";
    } catch (err) {
      authMsg.innerText = err.message;
    }
  };

  // Login
  loginBtn.onclick = async () => {
    authMsg.innerText = "Logging in...";
    try {
      await signInWithEmailAndPassword(
        auth,
        emailInput.value,
        passwordInput.value
      );
      authMsg.innerText = "Welcome back ✅";
    } catch (err) {
      authMsg.innerText = err.message;
    }
  };

  // Reset Password
  resetBtn.onclick = async () => {
    if (!emailInput.value) {
      authMsg.innerText = "Enter your email to reset password";
      return;
    }
    try {
      await sendPasswordResetEmail(auth, emailInput.value);
      authMsg.innerText = "Password reset email sent 📩";
    } catch (err) {
      authMsg.innerText = err.message;
    }
  };

  // Logout
  window.logout = async () => {
    await signOut(auth);
  };
    </script>
