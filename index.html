<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Engagement App</title>

<style>
body{margin:0;font-family:Arial;background:#0b0b0b;color:#fff}
.gold{color:#c9b26b}
#login,#app{max-width:420px;margin:auto;padding:30px}
input,button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none}
button{background:#c9b26b;font-weight:bold}
#app{display:none;padding-bottom:90px}
.card{background:#151515;padding:18px;border-radius:16px;margin-bottom:14px}
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;
  background:#101010;display:none;
  justify-content:space-around;padding:14px
}
.bottom-nav button{background:none;border:none;color:#c9b26b;font-size:16px}
.section{display:none}
.section.active{display:block}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <h2 class="gold" style="text-align:center">Engagement App</h2>
  <input id="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button id="loginBtn">Login</button>
  <p id="msg" style="color:red;text-align:center"></p>
</div>

<!-- APP -->
<div id="app">
  <h2 class="gold" style="text-align:center">Engagement App</h2>

  <div id="home" class="section active">
    <div class="card">Dashboard</div>
    <div class="card">Live Stream</div>
    <div class="card">Medical Support</div>
    <div class="card">Donations</div>
    <div class="card">Remote Church Jobs</div>
  </div>

  <div id="tasks" class="section">
    <div class="card">Tasks</div>
  </div>

  <div id="rewards" class="section">
    <div class="card">Rewards</div>
  </div>

  <div id="profile" class="section">
    <div class="card">
      <p id="userEmail"></p>
      <button id="logoutBtn">Logout</button>
    </div>
  </div>
</div>

<div class="bottom-nav" id="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('tasks')">Tasks</button>
  <button onclick="show('rewards')">Rewards</button>
  <button onclick="show('profile')">Profile</button>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAezp-Hh60aStIXWxDMp82PVh973eMbb0",
  authDomain: "engagement-app-72208.firebaseapp.com",
  projectId: "engagement-app-72208",
  appId: "1:994138223274:web:02b1d185fda4e3126f56d3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* 🔥 FORCE LOGOUT ON LOAD (KEY FIX) */
signOut(auth);

const loginBox = document.getElementById("login");
const appBox = document.getElementById("app");
const nav = document.getElementById("nav");

document.getElementById("loginBtn").onclick = ()=>{
  signInWithEmailAndPassword(
    auth,
    email.value,
    password.value
  ).catch(()=>msg.textContent="Wrong login");
};

document.getElementById("logoutBtn").onclick = ()=>signOut(auth);

onAuthStateChanged(auth,user=>{
  if(user){
    loginBox.style.display="none";
    appBox.style.display="block";
    nav.style.display="flex";
    userEmail.textContent=user.email;
  }else{
    loginBox.style.display="block";
    appBox.style.display="none";
    nav.style.display="none";
  }
});

window.show=name=>{
  document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));
  document.getElementById(name).classList.add("active");
};
</script>

</body>
</html>
