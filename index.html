<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Rewards App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: #f5f5f5;
}

/* ---------- HEADINGS ---------- */
h1, h2, h3 {
  color: gold;
  font-weight: 900;
  letter-spacing: 1px;
}

/* ---------- BUTTONS ---------- */
button {
  background: gold;
  border: none;
  padding: 10px 14px;
  margin: 5px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* ---------- INPUTS ---------- */
input {
  padding: 10px;
  width: 90%;
  max-width: 320px;
  border-radius: 6px;
  border: none;
  margin-bottom: 10px;
}

/* ---------- AUTH ---------- */
#authBox {
  padding: 40px 20px;
  text-align: center;
}

/* ---------- NAVBAR ---------- */
#navBar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #111;
  padding: 10px;
  display: none;
  justify-content: space-around;
  z-index: 100;
  border-bottom: 1px solid rgba(255,215,0,0.25);
}

/* ---------- SECTIONS ---------- */
.section {
  display: none;
  padding: 100px 20px 120px;
  min-height: 100vh;
  overflow-y: auto;
}

.section.active {
  display: block;
}

/* ---------- CARDS ---------- */
.card {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 0 10px rgba(255,215,0,0.15);
}

/* ---------- SPINNER ---------- */
#spinner {
  display: none;
  margin: 20px auto;
  width: 40px;
  height: 40px;
  border: 4px solid #333;
  border-top: 4px solid gold;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authBox">
  <h2>Login / Signup</h2>

  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />

  <div>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
    <button id="resetBtn">Reset Password</button>
  </div>

  <div id="spinner"></div>
  <p id="authMsg"></p>
</div>

<!-- ================= NAVBAR ================= -->
<div id="navBar">
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('tasks')">Tasks</button>
  <button onclick="showSection('rewards')">Rewards</button>
  <button onclick="showSection('giving')">Donations</button>
  <button onclick="showSection('profile')">Profile</button>
  <button onclick="logout()">Logout</button>
</div>

<!-- ================= SECTIONS ================= -->

<div id="homeSection" class="section">
  <h2>Dashboard</h2>

  <div class="card">💰 Total Donations (placeholder)</div>
  <div class="card">🎯 Active Campaigns</div>
  <div class="card">📊 Donation Analytics</div>
</div>

<div id="tasksSection" class="section">
  <h2>Tasks</h2>
  <div class="card">Verify donor payments</div>
  <div class="card">Approve withdrawals</div>
</div>

<div id="rewardsSection" class="section">
  <h2>Rewards</h2>
  <div class="card">🥇 Platinum Donor</div>
  <div class="card">🥈 Gold Sponsor</div>
</div>

<div id="givingSection" class="section">
  <h2>Donations</h2>
  <div class="card">Payment gateway placeholder</div>
</div>

<div id="profileSection" class="section">
  <h2>Profile</h2>
  <div class="card">
    Email: <span id="profileEmail"></span>
  </div>
</div>

<!-- ================= SCRIPT ================= -->
<script type="module">
document.addEventListener("DOMContentLoaded", async () => {

  const authBox = document.getElementById("authBox");
  const navBar = document.getElementById("navBar");
  const authMsg = document.getElementById("authMsg");
  const spinner = document.getElementById("spinner");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const signupBtn = document.getElementById("signupBtn");
  const loginBtn = document.getElementById("loginBtn");
  const resetBtn = document.getElementById("resetBtn");

  const sections = {
    home: document.getElementById("homeSection"),
    tasks: document.getElementById("tasksSection"),
    rewards: document.getElementById("rewardsSection"),
    giving: document.getElementById("givingSection"),
    profile: document.getElementById("profileSection")
  };

  const { initializeApp } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js");
  const {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
  } = await import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js");
const firebaseConfig = {
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "rewards-task-mvp.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const setLoading = (state, msg="") => {
    spinner.style.display = state ? "block" : "none";
    signupBtn.disabled = loginBtn.disabled = resetBtn.disabled = state;
    authMsg.innerText = msg;
  };

  signupBtn.onclick = async () => {
    setLoading(true, "Creating account...");
    try {
      await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    } catch (e) {
      authMsg.innerText = e.message;
    }
    setLoading(false);
  };

  loginBtn.onclick = async () => {
    setLoading(true, "Logging in...");
    try {
      await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    } catch (e) {
      authMsg.innerText = e.message;
    }
    setLoading(false);
  };

  resetBtn.onclick = async () => {
    setLoading(true, "Sending reset email...");
    try {
      await sendPasswordResetEmail(auth, emailInput.value);
      authMsg.innerText = "Reset email sent 📩";
    } catch (e) {
      authMsg.innerText = e.message;
    }
    setLoading(false);
  };

  window.showSection = name => {
    Object.values(sections).forEach(s => s.classList.remove("active"));
    sections[name].classList.add("active");
  };

  onAuthStateChanged(auth, user => {
    if (user) {
      authBox.style.display = "none";
      navBar.style.display = "flex";
      document.getElementById("profileEmail").innerText = user.email;
      showSection("home");
    } else {
      authBox.style.display = "block";
      navBar.style.display = "none";
    }
  });

  window.logout = () => signOut(auth);
});
</script>

</body>
  </html>
