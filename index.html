<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🙏 Church App</title>
<style>
body { font-family: Arial; background: #f0f2f5; margin: 0; padding: 0; font-size:16px; }
.container { max-width: 900px; margin: 30px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
h1 { color: #2c3e50; margin-bottom: 25px; font-size: 28px; }
h2 { font-size: 22px; margin-top: 25px; }
#nav-buttons { display: flex; margin-bottom: 25px; gap: 12px; }
#nav-buttons button { flex: 1; padding: 14px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background: #2c3e50; color: #fff; transition: 0.3s; }
#nav-buttons button:hover { background: #1a252f; }
#nav-buttons .active { background: #1abc9c; color: #fff; }

.section { display: none; }
.active-section { display: block; }

.box { background: #f9f9f9; border: 1px solid #ddd; padding: 18px; border-radius: 10px; margin-top: 15px; font-size: 16px; }
ul { list-style: none; padding: 0; margin: 0; }
li { padding: 10px 12px; border-bottom: 1px solid #eee; font-size:16px; }
li:last-child { border-bottom: none; }

button.action { background: #1abc9c; margin-top: 15px; width: 100%; font-size: 18px; padding: 14px; border-radius: 8px; color: #fff; border: none; cursor: pointer; }
button.action:hover { background: #16a085; }

input, textarea { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #ccc; margin-top: 12px; font-size: 16px; }
textarea { resize: vertical; }
                                                                                                                                    </style>
</head>
<body>

<div class="container">
  <h1>🙏 Church App</h1>

  <!-- Navigation -->
  <div id="nav-buttons">
    <button id="btn-dashboard" class="active" onclick="showSection('dashboard')">🏆 Dashboard</button>
    <button id="btn-ai" onclick="showSection('ai')">🤖 AI Secretary</button>
  </div>

  <!-- Dashboard Section -->
  <div id="dashboard" class="section active-section">
    <h2>🗂 Tasks</h2>
    <div id="tasks" class="box">
      <ul id="task-list"></ul>
    </div>
    <h2>💰 Rewards</h2>
    <div id="rewards" class="box"></div>
    <button class="action" onclick="addTask()">Add Task</button>
  </div>

  <!-- AI Secretary Section -->
  <div id="ai" class="section">
    <h2>🤖 Ask AI Secretary</h2>
    <textarea id="ai-input" placeholder="Ask your secretary anything or send a prayer request..."></textarea>
    <button class="action" onclick="aiReply()">Send</button>
    <div id="ai-output" class="box"></div>
    <h3>📝 Prayer Requests Log</h3>
    <ul id="prayer-log" class="box"></ul>
  </div>

</div>

<script>
  // ---------- Navigation ----------
  function showSection(section){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active-section'));
    document.getElementById(section).classList.add('active-section');
    document.querySelectorAll('#nav-buttons button').forEach(b=>b.classList.remove('active'));
    if(section==='dashboard') document.getElementById('btn-dashboard').classList.add('active');
    else document.getElementById('btn-ai').classList.add('active');
  }

  // ---------- Reward Task ----------
  let tasks = [
    { name: "Task 1", status: "Pending" },
    { name: "Task 2", status: "Completed" }
  ];
  let points = 10;

  function renderTasks(){
    const ul = document.getElementById("task-list");
    ul.innerHTML = "";
    tasks.forEach((t,i)=>{
      const li = document.createElement("li");
      li.textContent = `${t.name} - ${t.status}`;
      ul.appendChild(li);
    });
  }

  function renderRewards(){
    document.getElementById("rewards").innerText = `You have earned: ${points} points`;
  }

  function addTask(){
    const nextNum = tasks.length + 1;
    tasks.push({ name: `Task ${nextNum}`, status: "Pending" });
    points += 5;
    renderTasks();
    renderRewards();
  }

  renderTasks();
  renderRewards();

  // ---------- AI Secretary ----------
  let prayerRequests = [];

  function aiReply(){
    const input = document.getElementById("ai-input").value.trim();
    if(!input) return alert("Type a question or prayer request first");

    let answer = "Pastor AI received: " + input;

    // Detect prayer request
    if(input.toLowerCase().includes("pray") || input.toLowerCase().includes("prayer")){
      prayerRequests.push(input);
      renderPrayerLog();
      answer = "🙏 Your prayer request has been noted by Pastor AI.";
    }

    // Detect task or reward queries
    if(input.toLowerCase().includes("task")) answer = "Your next task is to complete your goal!";
    if(input.toLowerCase().includes("reward")) answer = `You currently have ${points} points. Keep going!`;
    if(input.toLowerCase().includes("hello")) answer = "Hello! How can I assist you today?";

    document.getElementById("ai-output").innerText = answer;
    document.getElementById("ai-input").value = "";
  }

  function renderPrayerLog(){
    const ul = document.getElementById("prayer-log");
    ul.innerHTML = "";
    prayerRequests.forEach((p,i)=>{
      const li = document.createElement("li");
      li.textContent = `#${i+1} - ${p}`;
      ul.appendChild(li);
    });
  }
</script>

</body>
  </html>
