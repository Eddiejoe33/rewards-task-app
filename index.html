<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church App</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: #fff;
  height: 100vh;
}

/* ===== LOADER ===== */
#loadingScreen {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  color: gold;
  font-size: 18px;
  z-index: 999;
}

/* ===== AUTH ===== */
#authBox {
  padding: 30px;
  text-align: center;
}

#authBox h2 {
  color: gold;
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

button {
  padding: 14px;
  margin: 10px 5px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

#authMsg {
  margin-top: 10px;
  color: #ffcc00;
}

/* ===== APP ===== */
#app {
  display: none;
  flex-direction: column;
  height: 100vh;
}

.section {
  display: none;
  padding: 20px;
  overflow-y: auto;
  flex: 1;
}

.section.active {
  display: block;
}

.section h3 {
  color: gold;
  margin-bottom: 15px;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  display: none;
  background: #111;
  padding: 10px;
  justify-content: space-around;
  border-top: 1px solid #333;
}

.bottom-nav button {
  background: none;
  color: gold;
  border: none;
  font-size: 14px;
  font-weight: bold;
}

/* ===== DASHBOARD CARDS ===== */
.card {
  background: #111;
  border: 1px solid gold;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 15px;
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loadingScreen">Loading Church App...</div>

<!-- AUTH -->
<div id="authBox">
  <h2>Login / Signup</h2>
  <input id="email" type="email" placeholder="Email" />
  <input id="password" type="password" placeholder="Password" />
  <div>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>
  <div id="authMsg"></div>
</div>

<!-- APP -->
<div id="app">

  <div id="homeSection" class="section">
    <h3>Dashboard</h3>
    <div class="card">Welcome: <span id="profileEmail"></span></div>
    <div class="card">Announcements</div>
    <div class="card">Events</div>
    <div class="card">Donations</div>
    <div class="card">Sermons</div>
    <div class="card">Live Stream (Coming Soon)</div>
  </div>

  <div id="profileSection" class="section">
    <h3>Profile</h3>
    <div class="card">Email: <span id="profileEmail"></span></div>
    <button onclick="logout()">Logout</button>
  </div>

</div>

<!-- NAV -->
<div class="bottom-nav">
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('profile')">Profile</button>
</div>

<script type="module">
/* ================= FIREBASE IMPORTS ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {
  getFirestore,
  doc,
  setDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ================= CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "rewards-task-mvp.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};

/* ================= INIT ================= */
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ================= ELEMENTS ================= */
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const authMsg = document.getElementById("authMsg");
const authBox = document.getElementById("authBox");
const appBox = document.getElementById("app");
const navBar = document.querySelector(".bottom-nav");
const profileEmail = document.querySelectorAll("#profileEmail");
const loader = document.getElementById("loadingScreen");

/* ================= UI ================= */
window.showSection = name => {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Section").classList.add("active");
};

/* ================= AUTH ================= */
document.getElementById("signupBtn").onclick = async () => {
  try {
    const cred = await createUserWithEmailAndPassword(
      auth,
      emailInput.value,
      passwordInput.value
    );
    await setDoc(doc(db, "users", cred.user.uid), {
      email: cred.user.email,
      createdAt: new Date()
    });
    authMsg.textContent = "Account created";
  } catch (e) {
    authMsg.textContent = e.message;
  }
};

document.getElementById("loginBtn").onclick = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      emailInput.value,
      passwordInput.value
    );
  } catch (e) {
    authMsg.textContent = e.message;
  }
};

window.logout = () => signOut(auth);

/* ================= STATE ================= */
onAuthStateChanged(auth, user => {
  loader.style.display = "none";

  if (user) {
    authBox.style.display = "none";
    appBox.style.display = "flex";
    navBar.style.display = "flex";
    profileEmail.forEach(el => el.textContent = user.email);
    showSection("home");
  } else {
    authBox.style.display = "block";
    appBox.style.display = "none";
    navBar.style.display = "none";
  }
});
</script>

</body>
  </html>
