<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Church App Dashboard</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #000;
  color: #fff;
  min-height: 100vh;
}

/* HEADER */
.header {
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid #222;
}

.header h1 {
  color: #ffd400;
  font-size: 28px;
  font-weight: bold;
}

/* CONTENT */
.container {
  padding: 15px;
  padding-bottom: 120px; /* IMPORTANT FIX */
}

.section-title {
  color: #ffd400;
  font-size: 22px;
  margin-bottom: 15px;
}

/* CARD */
.card {
  background: #111;
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 0 15px rgba(255,212,0,0.15);
}

.card h3 {
  font-size: 16px;
  margin-bottom: 6px;
}

.card p {
  font-size: 14px;
  opacity: 0.85;
}

/* LIVE STREAM */
.live-box {
  margin-top: 10px;
  background: #000;
  border: 1px dashed #333;
  height: 140px;
  border-radius: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #aaa;
}

.live-box span {
  font-size: 14px;
}

.play {
  font-size: 40px;
  color: #ffd400;
  margin-bottom: 8px;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #ffd400;
  display: flex;
  justify-content: space-around;
  padding: 14px 0;
  z-index: 9999; /* IMPORTANT FIX */
}

.bottom-nav button {
  background: none;
  border: none;
  font-weight: bold;
  font-size: 14px;
  cursor: pointer;
  color: #000;
}

.bottom-nav button.active {
  border-bottom: 3px solid #000;
  padding-bottom: 4px;
}

/* LOADER */
#loader {
  position: fixed;
  inset: 0;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #222;
  border-top: 4px solid #ffd400;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<!-- LOADER -->
<div id="loader">
  <div class="spinner"></div>
</div>

<!-- HEADER -->
<div class="header">
  <h1>CHURCH APP</h1>
</div>

<!-- CONTENT -->
<div class="container">
  <div class="section-title">Dashboard</div>

  <div class="card">
    <h3>💰 Total Donations</h3>
    <p>₦0 (demo)</p>
  </div>

  <div class="card">
    <h3>🎯 Active Campaigns</h3>
    <p>None yet</p>
  </div>

  <div class="card">
    <h3>📊 Donation Analytics</h3>
    <p>Coming soon</p>
  </div>

  <div class="card">
    <h3>👥 Total Members</h3>
    <p>0 (demo)</p>
  </div>

  <div class="card">
    <h3>📅 Upcoming Events</h3>
    <p>No events</p>
  </div>

  <div class="card">
    <h3>🔴 Live Service (Demo)</h3>
    <div class="live-box">
      <div class="play">▶</div>
      <span>Live on Facebook / YouTube</span>
      <span>No stream active</span>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="active" onclick="nav('Home')">HOME</button>
  <button onclick="nav('Tasks')">TASKS</button>
  <button onclick="nav('Rewards')">REWARDS</button>
  <button onclick="nav('Donate')">DONATE</button>
</div>

<script>
window.onload = () => {
  document.getElementById("loader").style.display = "none";
};

function nav(page) {
  alert(page + " page coming soon");
}
</script>

</body>
  </html>
