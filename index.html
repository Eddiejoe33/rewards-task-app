<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rewards Task MVP</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: #f4f6f8;
  color: #222;
}

.app {
  max-width: 420px;
  margin: 40px auto;
  padding: 16px;
}

nav {
  background: #111;
  color: #fff;
  display: none;
  flex-wrap: wrap;
  gap: 6px;
  padding: 10px;
  border-radius: 10px;
  margin-bottom: 20px;
}

nav button {
  background: #222;
  color: #fff;
  border: none;
  padding: 10px 14px;
  border-radius: 6px;
  cursor: pointer;
}

nav button:hover {
  background: #444;
}

.logout {
  background: #dc3545;
}

#authBox {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
}

button.primary {
  width: 100%;
  padding: 12px;
  margin-bottom: 10px;
  background: #000;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.msg {
  text-align: center;
  margin-top: 10px;
  min-height: 18px;
}

section {
  display: none;
}

section.active {
  display: block;
}

.card {
  background: #fff;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.xp {
  font-size: 22px;
  font-weight: bold;
}

.task-btn {
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 6px;
  margin-top: 10px;
  cursor: pointer;
  background: #007bff;
  color: #fff;
}

.task-btn.secondary { background: #28a745; }
.task-btn.danger { background: #dc3545; }
</style>
</head>

<body>
<div class="app">

<nav id="navBar">
  <button onclick="showSection('home')">Home</button>
  <button onclick="showSection('tasks')">Tasks</button>
  <button onclick="showSection('rewards')">Rewards</button>
  <button onclick="showSection('profile')">Profile</button>
  <button onclick="showSection('giving')">Giving</button>
  <button class="logout" onclick="logout()">Logout</button>
</nav>

<div id="authBox">
  <h2>Login / Sign Up</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <button class="primary" id="signupBtn">Sign Up</button>
  <button class="primary" id="loginBtn">Login</button>
  <div class="msg" id="authMsg"></div>
</div>

<section id="homeSection">
  <div class="card">
    <h2>Dashboard</h2>
    <p class="xp" id="xp">0 XP</p>
  </div>
</section>

<section id="tasksSection">
  <div class="card">
    <h3>Daily Task</h3>
    <button class="task-btn" id="dailyTask">Complete (+20 XP)</button>
  </div>
  <div class="card">
    <h3>Invite Friend</h3>
    <button class="task-btn secondary" id="inviteTask">Invite (+50 XP)</button>
  </div>
</section>

<section id="rewardsSection">
  <div class="card">
    <h3>Redeem Reward</h3>
    <button class="task-btn danger" id="redeemBtn">Redeem 200 XP</button>
  </div>
</section>

<section id="profileSection">
  <div class="card">
    <h3>Profile</h3>
    <p id="profileEmail"></p>
  </div>
</section>

<section id="givingSection">
  <div class="card">
    <h3>Giving</h3>
    <p>Support good causes 🙏</p>
  </div>
</section>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "rewards-task-mvp.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let xp = 0;
let currentUID = null;

const msg = document.getElementById("authMsg");
const xpEl = document.getElementById("xp");
const profileEmail = document.getElementById("profileEmail");

window.showSection = name => {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Section").classList.add("active");
};

async function ensureUserDoc(uid, email) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (!snap.exists()) {
    await setDoc(ref, { email, xp: 0 });
    return 0;
  }
  return snap.data().xp || 0;
}

document.getElementById("signupBtn").onclick = async () => {
  msg.textContent = "Signing up...";
  try {
    const cred = await createUserWithEmailAndPassword(auth, email.value, password.value);
    await ensureUserDoc(cred.user.uid, cred.user.email);
    msg.textContent = "Account created ✅";
  } catch (e) {
    msg.textContent = e.message;
  }
};

document.getElementById("loginBtn").onclick = async () => {
  msg.textContent = "Logging in...";
  try {
    await signInWithEmailAndPassword(auth, email.value, password.value);
    msg.textContent = "";
  } catch (e) {
    msg.textContent = e.message;
  }
};

window.logout = async () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUID = user.uid;
    xp = await ensureUserDoc(user.uid, user.email);
    xpEl.textContent = xp + " XP";
    profileEmail.textContent = user.email;
    authBox.style.display = "none";
    navBar.style.display = "flex";
    showSection("home");
  } else {
    currentUID = null;
    authBox.style.display = "block";
    navBar.style.display = "none";
  }
});

function saveXP() {
  if (!currentUID) return;
  setDoc(doc(db, "users", currentUID), { xp }, { merge: true });
}

dailyTask.onclick = () => { xp += 20; xpEl.textContent = xp + " XP"; saveXP(); };
inviteTask.onclick = () => { xp += 50; xpEl.textContent = xp + " XP"; saveXP(); };
redeemBtn.onclick = () => {
  if (xp < 200) return alert("Not enough XP");
  xp -= 200;
  xpEl.textContent = xp + " XP";
  saveXP();
  alert("Reward redeemed 🎉");
};
</script>
</body>
  </html>
