<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reward Task MVP</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:20px; }
    .container { max-width:800px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    h1{color:#2c3e50;}
    .box {border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px;}
    button {padding:10px; margin-top:5px; background:#2c3e50;color:white;border:none;cursor:pointer;}
    button:hover{background:black;}
    ul {list-style:none; padding:0;}
    li {padding:5px 0; border-bottom:1px solid #eee;}
  </style>
</head>
<body>

<div class="container">
  <h1>🎯 Reward Task MVP</h1>

  <h2>🏆 Dashboard</h2>
  <div id="tasks" class="box">
    <ul>
      <li>Task 1 - Pending</li>
      <li>Task 2 - Completed</li>
      <li>Task 3 - Pending</li>
    </ul>
  </div>

  <h2>💰 Rewards</h2>
  <div id="rewards" class="box">
    <p>You have earned: 10 points</p>
  </div>

  <button onclick="addTask()">Add Task</button>
</div>

<script>
let taskCount = 3;

function addTask(){
  taskCount++;
  const ul = document.querySelector("#tasks ul");
  const li = document.createElement("li");
  li.textContent = "Task " + taskCount + " - Pending";
  ul.appendChild(li);
}
</script>

</body>
</html>
