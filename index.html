<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Church App</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #0b0b0b;
    color: #fff;
    padding-bottom: 90px;
}

/* CARD STYLE */
.card {
    background: linear-gradient(145deg, #111, #1a1a1a);
    border-radius: 18px;
    padding: 18px;
    margin: 16px;
}

/* HEADINGS */
h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

/* DASHBOARD */
.dashboard p {
    margin-top: 8px;
    color: #ccc;
}

/* TASKS */
.task {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 12px 0;
    border-bottom: 1px solid #222;
    padding-bottom: 10px;
}

.task button {
    background: #f5c400;
    border: none;
    padding: 8px 16px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

/* LIVE VIDEO */
.video-wrapper {
    position: relative;
    padding-bottom: 56.25%;
    height: 0;
    border-radius: 14px;
    overflow: hidden;
}

.video-wrapper iframe {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 0;
}

/* SECTION ANCHORS */
.section {
    scroll-margin-top: 20px;
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: #000;
    border-top: 1px solid #222;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 99999;
}

.bottom-nav button {
    background: none;
    border: none;
    color: #f5c400;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}
</style>
</head>

<body id="top">

<!-- DASHBOARD -->
<div class="card dashboard section" id="home">
    <h2>Dashboard</h2>
    <p>Email: example@email.com</p>
    <p>XP: 0</p>
</div>

<!-- TASKS -->
<div class="card section" id="tasks">
    <h2>📝 Tasks</h2>

    <div class="task">
        <span>Watch Live Stream</span>
        <button>Complete</button>
    </div>

    <div class="task">
        <span>Share App</span>
        <button>Complete</button>
    </div>

    <div class="task">
        <span>Invite Friend</span>
        <button>Complete</button>
    </div>
</div>

<!-- LIVE STREAM -->
<div class="card section" id="live">
    <h2>📺 Live Stream</h2>

    <div class="video-wrapper">
        <iframe 
            src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=0&mute=0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>

    <p style="margin-top:10px;color:#aaa;">
        Live placeholder – connects to social platforms later
    </p>
</div>

<!-- MEDICAL & WELLNESS -->
<div class="card section" id="medical">
    <h2>🩺 Medical & Wellness</h2>
    <p style="color:#ccc;">
        Health tips, prayer requests, wellness tracking coming soon.
    </p>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
    <button onclick="scrollToSection('home')">Home</button>
    <button onclick="scrollToSection('live')">Live</button>
    <button onclick="scrollToSection('tasks')">Tasks</button>
    <button onclick="scrollToSection('medical')">Profile</button>
</div>

<script>
function scrollToSection(id) {
    const el = document.getElementById(id);
    if (el) {
        el.scrollIntoView({ behavior: 'smooth' });
    }
}
</script>

</body>
    </html>
