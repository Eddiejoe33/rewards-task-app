<script type="module">
/* =========================
   SAFE FIREBASE BOOTSTRAP
========================= */

console.log("App starting...");

// --- DOM READY CHECK ---
const authBox = document.getElementById("authBox");
const navBar = document.getElementById("navBar");
const authMsg = document.getElementById("authMsg");

if (!authBox || !navBar) {
  document.body.innerHTML = "<h2 style='color:red'>HTML not loaded properly</h2>";
  throw new Error("Missing DOM elements");
}

// --- SHOW AUTH BY DEFAULT (prevents white screen) ---
authBox.style.display = "block";
navBar.style.display = "none";

/* =========================
   FIREBASE IMPORTS
========================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* =========================
   REAL CONFIG REQUIRED
========================= */
 apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "154842831298",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};


let auth;

try {
  const app = initializeApp(firebaseConfig);
  auth = getAuth(app);
} catch (e) {
  authMsg.innerText = "Firebase config error";
  console.error(e);
}

/* =========================
   ELEMENTS
========================= */
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

document.getElementById("signupBtn").onclick = signup;
document.getElementById("loginBtn").onclick = login;
document.getElementById("resetBtn").onclick = resetPassword;

/* =========================
   SECTIONS (FIXED)
========================= */
const sections = {
  home: document.getElementById("homeSection"),
  tasks: document.getElementById("tasksSection"),
  rewards: document.getElementById("rewardsSection"),
  profile: document.getElementById("profileSection"),
  giving: document.getElementById("givingSection")
};

window.showSection = (name) => {
  Object.values(sections).forEach(s => s.classList.remove("active"));
  sections[name]?.classList.add("active");
};

/* =========================
   AUTH STATE
========================= */
onAuthStateChanged(auth, (user) => {
  if (user) {
    authBox.style.display = "none";
    navBar.style.display = "flex";
    document.getElementById("profileEmail").innerText = user.email;
    showSection("home");
  } else {
    authBox.style.display = "block";
    navBar.style.display = "none";
  }
});

/* =========================
   AUTH ACTIONS
========================= */
async function signup() {
  authMsg.innerText = "Creating account...";
  try {
    await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    authMsg.innerText = "Account created 🎉";
  } catch (e) {
    authMsg.innerText = e.message;
  }
}

async function login() {
  authMsg.innerText = "Logging in...";
  try {
    await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    authMsg.innerText = "Welcome back ✅";
  } catch (e) {
    authMsg.innerText = e.message;
  }
}

async function resetPassword() {
  if (!emailInput.value) {
    authMsg.innerText = "Enter your email";
    return;
  }
  try {
    await sendPasswordResetEmail(auth, emailInput.value);
    authMsg.innerText = "Reset email sent 📩";
  } catch (e) {
    authMsg.innerText = e.message;
  }
}

window.logout = async () => {
  await signOut(auth);
};
  </script>
