<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Church Rewards App</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: #0b0b0b;
  color: #f5f5f5;
  font-family: Arial, sans-serif;
}

/* HEADER */
.header {
  height: 64px;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-bottom: 1px solid rgba(255,215,0,0.4);
}

.header h1 {
  color: gold;
  margin: 0;
  font-weight: 900;
}

/* MAIN */
.main-content {
  padding: 16px;
  padding-bottom: 120px;
}

/* SECTIONS */
.section { display: none; }
.section.active { display: block; }

/* CARD */
.card {
  background: #1a1a1a;
  padding: 16px;
  border-radius: 14px;
  margin-bottom: 16px;
  box-shadow: 0 0 12px rgba(255,215,0,0.25);
}

/* AUTH */
#authBox {
  padding: 40px 20px;
  text-align: center;
}

input {
  width: 90%;
  max-width: 320px;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
}

button {
  background: gold;
  border: none;
  padding: 12px 18px;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
}

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 90px;
  background: gold;
  display: flex;
  justify-content: space-around;
  align-items: center;
}

.bottom-nav button {
  background: none;
  border: none;
  font-weight: 900;
}

.bottom-nav button.active {
  text-decoration: underline;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="authBox">
  <h2 style="color:gold">Login / Signup</h2>
  <input id="email" type="email" placeholder="Email">
  <input id="password" type="password" placeholder="Password">
  <div>
    <button id="signupBtn">Sign Up</button>
    <button id="loginBtn">Login</button>
  </div>
  <p id="authMsg"></p>
</div>

<!-- APP -->
<div id="app" style="display:none">

<header class="header">
  <h1>CHURCH APP</h1>
</header>

<main class="main-content">

<section id="homeSection" class="section active">
  <h2 style="color:gold">Dashboard</h2>
  <div class="card">💰 Total Donations — ₦0 (demo)</div>
  <div class="card">🎯 Active Campaigns — None</div>
</section>

<section id="tasksSection" class="section">
  <h2 style="color:gold">Tasks</h2>

  <div class="card">
    Verify donor payments
    <br><br>
    <button onclick="completeTask(this)">Complete</button>
  </div>

  <div class="card">
    Share Sunday service
    <br><br>
    <button onclick="completeTask(this)">Complete</button>
  </div>
</section>

<section id="rewardsSection" class="section">
  <h2 style="color:gold">Rewards</h2>
  <div class="card">🥇 Platinum Donor (demo)</div>
</section>

<section id="givingSection" class="section">
  <h2 style="color:gold">Donations</h2>
  <div class="card">Payment gateway coming soon</div>
</section>

<section id="profileSection" class="section">
  <h2 style="color:gold">Profile</h2>
  <div class="card">
    <p id="profileEmail"></p>
    <button onclick="logout()">Logout</button>
  </div>
</section>

</main>

<nav class="bottom-nav">
  <button class="active" onclick="showSection('home',this)">HOME</button>
  <button onclick="showSection('tasks',this)">TASKS</button>
  <button onclick="showSection('rewards',this)">REWARDS</button>
  <button onclick="showSection('giving',this)">DONATE</button>
  <button onclick="showSection('profile',this)">PROFILE</button>
</nav>

</div>

<!-- ✅ SCRIPT GOES AT THE BOTTOM -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged,
  signOut,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDImP8ODFS0lxWZ5AdTLi7jTxZzFo6JxeY",
  authDomain: "rewards-task-mvp.firebaseapp.com",
  projectId: "rewards-task-mvp",
  appId: "1:154842831298:web:9ff9e24acfaf346aa99e5b"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const authBox = document.getElementById("authBox");
const appBox = document.getElementById("app");
const authMsg = document.getElementById("authMsg");

signupBtn.onclick = () =>
  createUserWithEmailAndPassword(auth, email.value, password.value)
    .catch(e => authMsg.innerText = e.message);

loginBtn.onclick = () =>
  signInWithEmailAndPassword(auth, email.value, password.value)
    .catch(e => authMsg.innerText = e.message);

window.logout = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if (user) {
    authBox.style.display = "none";
    appBox.style.display = "block";
    profileEmail.textContent = user.email;
  }
});

window.showSection = (name, btn) => {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.getElementById(name + "Section").classList.add("active");
  document.querySelectorAll(".bottom-nav button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
};

window.completeTask = (btn) => {
  btn.innerText = "Completed ✓";
  btn.disabled = true;
};
</script>

</body>
  </html>
