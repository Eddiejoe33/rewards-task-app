<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Secretary MVP</title>
  <style>
    body { font-family: Arial; background:#f4f6f9; padding:20px; }
    .container { max-width:600px; margin:auto; background:white; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
    h1{color:#2c3e50;}
    textarea {width:100%; padding:10px; margin-top:10px;}
    button {padding:10px; margin-top:5px; background:#2c3e50;color:white;border:none;cursor:pointer;}
    button:hover{background:black;}
    #ai-output {border:1px solid #ddd; padding:10px; margin-top:10px; border-radius:5px; white-space:pre-wrap;}
  </style>
</head>
<body>

<div class="container">
  <h1>🤖 AI Secretary MVP</h1>

  <h2>Ask your AI Secretary</h2>
  <textarea id="ai-input" placeholder="Ask your secretary anything..."></textarea>
  <button onclick="aiReply()">Ask AI</button>
  <div id="ai-output"></div>
</div>

<script>
function aiReply(){
  const q = document.getElementById("ai-input").value.trim();
  if(!q) return alert("Type a question first");

  // Simple fake AI logic
  let answer = "I'm thinking...";
  if(q.toLowerCase().includes("task")) answer = "Your next task is to complete your study goal.";
  if(q.toLowerCase().includes("reward")) answer = "You need 3 more tasks to unlock a reward.";
  if(q.toLowerCase().includes("tired")) answer = "Take a break and drink water.";

  document.getElementById("ai-output").innerText = answer;
}
</script>

</body>
    </html>
